# Public financial reports: recent eight completed reporting periods.
name: Fin Collect
on:
  schedule:
    - cron: "0 3 * * *"   # 03:00 UTC / 11:00 CST
  workflow_dispatch:
    inputs:
      codes:
        description: "Optional comma-separated stock codes for a cloud smoke run"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: fin-collect
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Financial contract fixtures
        run: python3 scripts/test_collect_fin.py
      - name: Collect financial data
        env:
          FIN_CODES: ${{ inputs.codes }}
        run: |
          set -euo pipefail
          args=(--sleep 0.7)
          if [ -n "$FIN_CODES" ]; then args+=(--codes "$FIN_CODES"); fi
          python3 scripts/collect_fin.py "${args[@]}"
      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "fin-bot"
          git config user.email "fin-bot@users.noreply.github.com"
          git add data/fin/
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "[CI] fin collect $(date +%Y%m%d)"
          for i in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            if [ "$i" -eq 3 ]; then exit 1; fi
            git fetch origin main
            git rebase origin/main
            sleep 10
          done
          exit 1
