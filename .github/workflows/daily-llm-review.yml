# LLM 辅助复盘 (每日 16:15 CST)
# LLM: GitCode 免费 AI (deepseek-ai/DeepSeek-V4-Flash, 备选 Qwen/Qwen3-30B-A3B-Instruct-2507)
name: daily-llm-review
on:
  schedule:
    - cron: '15 8 * * 1-5'   # 16:15 CST 收盘后
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync remote main
        run: |
          git fetch origin main
          git merge --ff-only origin/main || echo "already up to date"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run hot_impact
        run: python3 scripts/hot_impact.py --out-dir data
      - name: LLM 复盘 (GitCode 免费 AI: DeepSeek-V4-Flash, 备选 Qwen3-30B)
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          set -e
          python3 << 'PYEOF'
          import os, json, urllib.request
          data=json.load(open('data/latest.json'))
          try:
              hi=json.load(open('data/hot_impact.json'))
          except FileNotFoundError:
              hi={"reports":[]}
          ctx=json.dumps({"market":data["market"],"phase":data.get("phase"),
                          "themes":[t["name"] for t in data.get("themes",[])][:10],
                          "hot_impact":[{"theme":r["theme"],
                                         "stocks":[{"code":s["code"],"name":s["name"],"signal":s["signal"],
                                                   "ret_5d":s["ret_5d"],"pos20":s["pos20"]}
                                                    for s in r["stocks"]]}
                                        for r in hi.get("reports",[])[:6]],
                          "funds_top5":[(f["code"],f["name"],f.get("ret_1y"))
                                        for f in data.get("fund_rank",[])[:5]]},
                         ensure_ascii=False)
          prompt=f"""你是A股复盘分析师。基于以下当日数据(JSON), 写一份300字内的复盘:
          1) 市场情绪与主线判断
          2) 热点推演中哪些信号最值得关注 (按信号强度排序)
          3) 明日情景推演 (进攻/防守两种)
          直接输出markdown, 不要免责声明。
          数据:
          {ctx}
          """
          def chat(prompt, model):
              body=json.dumps({"model":model,"messages":[{"role":"user","content":prompt}],"temperature":0.3}).encode()
              req=urllib.request.Request("https://gitcode.com/api/v5/chat/completions", data=body, method="POST",
                  headers={"Authorization":f"Bearer {os.environ['GITCODE_TOKEN']}","Content-Type":"application/json"})
              with urllib.request.urlopen(req, timeout=180) as r:
                  return json.loads(r.read())["choices"][0]["message"]["content"]
          try:
              out=chat(prompt, os.environ.get("LLM_MODEL","deepseek-ai/DeepSeek-V4-Flash"))
          except Exception as e:
              print("primary model failed, fallback:", str(e)[:200], flush=True)
              try:
                  out=chat(prompt, "Qwen/Qwen3-30B-A3B-Instruct-2507")
              except Exception as e2:
                  print("llm err:", str(e2)[:200], flush=True)
                  exit(0)
          md=f"# 每日LLM复盘 {__import__('datetime').datetime.now(__import__('datetime').timezone(__import__('datetime').timedelta(hours=8))).strftime('%Y-%m-%d')}\n\n"+out
          os.makedirs("review", exist_ok=True)
          open(f"review/{__import__('datetime').datetime.now(__import__('datetime').timezone(__import__('datetime').timedelta(hours=8))).strftime('%Y-%m-%d')}.md","w").write(md)
          print("llm review done", flush=True)
          PYEOF
      - name: Commit & push
        run: |
          python3 scripts/git_push_retry.py --msg "review" --dir data \
            --user ai-bot \
            --protect data/ai_review.json --protect data/ai_review.md