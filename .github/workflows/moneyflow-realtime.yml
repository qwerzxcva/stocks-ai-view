# 主力资金实时采集 — 盘中每 2 分钟一次 (与其他采集错峰)
#
# 只在主仓 (A) 跑。资金流是单值数据, 不需要三仓冗余; 三仓都跑会把对东财
# 的请求量 x3, 直接触发 WAF 封锁 (2026-10-14 实测: 单仓 2 分钟一轮
# 已能把 push2 打到 0% 成功率)。
name: moneyflow-realtime

on:
  schedule:
    # UTC 1,2,3,5,6,7 时 = CST 09:00-15:00, 分钟位 mod5=3
    - cron: '3,8,13,18,23,28,33,38,43,48,53,58 1,2,3,5,6,7 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: moneyflow-realtime
  cancel-in-progress: true

jobs:
  collect:
    # 仓库守卫: 镜像仓 (B/C) 同步本文件后靠这里跳过, 不打东财
    if: github.repository == 'qwerzxcva/stocks-ai-view'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync remote main
        run: |
          git fetch origin main
          git merge --ff-only origin/main || echo "already up to date"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 资金流只需要标准库, 但 collect_moneyflow 会 import paths,
      # 而 paths 只依赖标准库, 所以不需要装依赖。
      - name: Collect moneyflow
        run: |
          # --top 12: 每只股票 2 个请求 (分钟+日), 12 只 = 24 次 + 4 个全局 = 28 次/轮
          # 配 retries=2 与熔断器, 单轮最坏 56 次 (原 352 次)
          python3 scripts/collect_moneyflow.py --top 12 --out data/moneyflow.json \
            || echo "::warning::moneyflow 采集失败 (东财 WAF?), 保留上一版"

      - name: Report
        run: |
          python3 - <<'PY'
          import json, os
          p = "data/moneyflow.json"
          if not os.path.exists(p):
              print("no moneyflow.json")
              raise SystemExit(0)
          d = json.load(open(p, encoding="utf-8"))
          print("ts:", d.get("ts"))
          print("indices:", len(d.get("indices") or []))
          for x in (d.get("indices") or [])[:3]:
              print("  %s 主力净额 %.2f亿 (%s%%)" % (
                  x.get("name"), (x.get("main_net") or 0) / 1e8, x.get("main_net_pct")))
          st = d.get("stocks") or {}
          print("stocks:", len(st))
          ti = d.get("top_inflow") or []
          to = d.get("top_outflow") or []
          print("净流入:", ", ".join("%s %.2f亿" % (r["code"], r["main_net"] / 1e8) for r in ti[:3]))
          print("净流出:", ", ".join("%s %.2f亿" % (r["code"], r["main_net"] / 1e8) for r in to[:3]))
          PY

      - name: Commit and push
        run: |
          python3 scripts/git_push_retry.py --msg "moneyflow: realtime main-force flow" \
            data/moneyflow.json \
            --protect data/moneyflow.json
