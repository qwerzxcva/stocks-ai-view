# 热点推演 — 交易日盘中多次更新
# 原 daily-llm-review 的 cron 是 15 8 * * 1-5 (每天只在 16:15 跑一次),
# 导致 hot_impact.json 一天只更新一次且与盘中热点脱节。
# 本工作流在交易时段每 30 分钟跑一次 (CST 09:40~15:10),
# 热点源用同花顺强势股题材归因 (实时) + 新闻词频。
name: hot-impact-realtime
on:
  schedule:
    # CST 09:40 / 10:10 / 10:40 / 11:10 / 11:40
    #      13:10 / 13:40 / 14:10 / 14:40 / 15:10
    - cron: '3,13,23,33,43,53 * * 1-5'   # 每10分钟错开3分钟 (远端sync在:00/:10/..., 本工作流随后刷新)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Sync remote main
        run: |
          git fetch origin main
          git merge --ff-only origin/main || echo "already up to date"


      # K线仓 (find_related 需要 universe.csv; 大仓 sparse-checkout 只取 bulk)
      - name: Checkout kline repo (sparse)
        uses: actions/checkout@v4
        with:
          repository: qwerzxcva/stocks-data-kline
          token: ${{ secrets.GITHUB_TOKEN }}
          path: kline-repo
          sparse-checkout: |
            data/bulk/universe.csv
          sparse-checkout-cone-mode: false

      - name: Link universe.csv
        run: |
          mkdir -p ../stocks-data-kline/data/bulk
          cp kline-repo/data/bulk/universe.csv ../stocks-data-kline/data/bulk/ 2>/dev/null || true
          ls -la ../stocks-data-kline/data/bulk/universe.csv

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run hot_impact
        run: python3 scripts/hot_impact.py --out-dir data

      # 实时刷新 market 块 (涨停/跌停/炸板/涨跌家数/成交额/两融/指数)
      # 关键: 必须在远端 sync 之后跑, 否则会被覆盖回旧快照
      - name: Refresh market realtime
        run: |
          if [ -f data/latest.json ]; then
            python3 scripts/collect_market_extras.py --merge data/latest.json || true
            python3 -c "import json;m=json.load(open('data/latest.json'))['market'];print('  涨停',m['limit_up'],'跌停',m['limit_down'],'炸板',m['broken'],'涨',m['advance'],'跌',m['decline'])" || true
          fi

      # 强势股/龙虎榜/大宗交易 → 独立 enrich.json (盘中同步刷新)
      - name: Build enrich.json
        run: python3 scripts/build_enrich.py || true

      # AI 推股 (17指标共振, 盘中实时更新)
      - name: Build AI picks
        run: |
          python3 scripts/update_klines_recent.py --days 3 --limit 1500 --workers 10 || true
          python3 scripts/build_ai_picks.py --out data/ai_picks.json --limit 1500 || true
          echo "ai_picks: $(python3 -c "import json;print(len(json.load(open('data/ai_picks.json'))['picks']))" 2>/dev/null || echo 0) 只"

      - name: Verify output
        run: |
          python3 - <<'PY'
          import json, sys
          try:
              d = json.load(open('data/hot_impact.json', encoding='utf-8'))
          except Exception as e:
              print("hot_impact.json 读取失败:", e); sys.exit(1)
          reps = d.get('reports') or []
          n = sum(len(r.get('stocks') or []) for r in reps)
          print(f"主题 {len(reps)} 个 · 推演股票 {n} 只 · ts={d.get('ts')}")
          if n == 0:
              print("WARN: 无推演股票 (热点源或K线源异常), 保留上次数据")
          # 元数据必须带来源与时间 (用户要求标注)
          meta = d.get('meta') or {}
          for k in ('source', 'ts', 'freq'):
              if k not in meta:
                  print(f"WARN: meta 缺 {k}")
          PY

      - name: Commit & push
        run: |
          git config user.name "hot-bot"
          git config user.email "741059079@qq.com"
          git fetch origin main
          git reset --soft origin/main
          git add -A data/hot_impact.json data/hot_impact.md data/enrich.json data/ai_picks.json
          ts=$(TZ=Asia/Shanghai date '+%Y%m%d_%H%M')
          if git diff --quiet --cached HEAD; then
            echo "no changes"
          else
            git commit -m "hot-impact: $ts"
          fi
          git push origin main || {
            echo "push raced, retrying after reset"
            git fetch origin main
            git reset --soft origin/main
            git add -A data/hot_impact.json data/hot_impact.md data/enrich.json data/ai_picks.json
            git commit -m "hot-impact: $ts" 2>/dev/null || true
            git push origin main
          }

