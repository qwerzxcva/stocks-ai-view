# 热点推演 — 交易日盘中多次更新
# 原 daily-llm-review 的 cron 是 15 8 * * 1-5 (每天只在 16:15 跑一次),
# 导致 hot_impact.json 一天只更新一次且与盘中热点脱节。
# 本工作流在交易时段每 30 分钟跑一次 (CST 09:40~15:10),
# 热点源用同花顺强势股题材归因 (实时) + 新闻词频。
name: hot-impact-realtime
on:
  schedule:
    # CST 09:40 / 10:10 / 10:40 / 11:10 / 11:40
    #      13:10 / 13:40 / 14:10 / 14:40 / 15:10
    # 每10分钟错开3分钟跑一次: 分钟列 3/13/23/33/43/53, 小时与星期用 * 和 1-5
    # (GitHub cron 分钟位就是 0-59 列表, 不必也不允许再写小时列表)
    - cron: '3,13,23,33,43,53 * * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: write
# 并发控制: 心跳每 5 分钟触发一次, 不设组会出现两轮同时写 data/ 互相覆盖。
# 实时场景下新一轮顶掉旧轮更有价值。
concurrency:
  group: hot-impact-realtime
  cancel-in-progress: true
jobs:
  derive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Sync remote main
        run: |
          git fetch origin main
          git merge --ff-only origin/main || echo "already up to date"


      # K线仓 (find_related 需要 universe.csv; 大仓 sparse-checkout 只取 bulk)
      - name: Checkout kline repo (sparse)
        uses: actions/checkout@v4
        with:
          repository: qwerzxcva/stocks-data-kline
          token: ${{ secrets.GITHUB_TOKEN }}
          path: kline-repo
          sparse-checkout: |
            data/bulk/universe.csv
          sparse-checkout-cone-mode: false

      - name: Link universe.csv
        run: |
          mkdir -p ../stocks-data-kline/data/bulk
          cp kline-repo/data/bulk/universe.csv ../stocks-data-kline/data/bulk/ 2>/dev/null || true
          ls -la ../stocks-data-kline/data/bulk/universe.csv

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run hot_impact
        run: python3 scripts/hot_impact.py --out-dir data

      # 实时行情 → 独立文件 market_now.json (不碰 latest.json, 避免与远端 sync 冲突)
      - name: Build market_now.json
        run: |
          python3 scripts/build_market_now.py --out data/market_now.json || true
          python3 -c "import json;m=json.load(open('data/market_now.json'))['market'];print('  涨停',m['limit_up'],'跌停',m['limit_down'],'炸板',m['broken'],'涨',m['advance'],'跌',m['decline'])" || true

      # 强势股/龙虎榜/大宗交易 → 独立 enrich.json (盘中同步刷新)
      - name: Build enrich.json
        run: python3 scripts/build_enrich.py || true

      # 全源并发采集 + 合并去重 → data/all_sources.json (盘中每 10 分钟刷新)
      - name: Collect all sources + merge dedup
        run: |
          python3 scripts/collect_all_sources.py --out data/all_sources.json --workers 8 || true
          python3 - <<'PY'
          import json
          d = json.load(open('data/all_sources.json'))
          s = d['summary']
          print(f"all_sources: raw={s['total_raw']} merged={s['total_merged']} ts={s['ts'][:16]}")
          PY

      # AI 推股 (17指标共振, 盘中实时更新)
      - name: Build AI picks
        run: |
          python3 scripts/update_klines_recent.py --days 3 --limit 1500 --workers 10 || true
          python3 scripts/build_ai_picks.py --out data/ai_picks.json --limit 1500 || true
          echo "ai_picks: $(python3 -c "import json;print(len(json.load(open('data/ai_picks.json'))['picks']))" 2>/dev/null || echo 0) 只"

      - name: Verify output
        run: |
          python3 - <<'PY'
          import json, sys
          try:
              d = json.load(open('data/hot_impact.json', encoding='utf-8'))
          except Exception as e:
              print("hot_impact.json 读取失败:", e); sys.exit(1)
          reps = d.get('reports') or []
          n = sum(len(r.get('stocks') or []) for r in reps)
          print(f"主题 {len(reps)} 个 · 推演股票 {n} 只 · ts={d.get('ts')}")
          if n == 0:
              print("WARN: 无推演股票 (热点源或K线源异常), 保留上次数据")
          # 元数据必须带来源与时间 (用户要求标注)
          meta = d.get('meta') or {}
          for k in ('source', 'ts', 'freq'):
              if k not in meta:
                  print(f"WARN: meta 缺 {k}")
          PY

      - name: Commit & push
        run: |
          python3 scripts/git_push_retry.py --msg "hot-impact" --user hot-bot \
            --protect data/hot_impact.json --protect data/hot_impact.md --protect data/enrich.json --protect data/ai_picks.json --protect data/market_now.json --protect data/ban_prob.json --protect data/flow_divergence.json --protect data/all_sources.json
            data/hot_impact.json data/hot_impact.md data/enrich.json \
            data/ai_picks.json data/market_now.json data/ban_prob.json \
            data/flow_divergence.json data/all_sources.json

