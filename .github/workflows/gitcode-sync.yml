# GitHub ↔ GitCode 双向实时同步
#
# 分工: GitHub = CI + Pages + 数据采集主链路 (Actions)
#       GitCode = 数据镜像 + 云容器算力 + engines/ 25个补充引擎 (无 Actions API, 404)
#
# 三条链路:
#   步骤 A  GitHub → GitCode  : data/*.json 数据镜像      (30min + push 触发)
#   步骤 B  GitCode → GitHub  : engines/ 新引擎回流 scripts/ 并 commit 回 GitHub
#   步骤 C  GitHub → GitCode  : scripts/*.py → engines/   保持两侧脚本同步
#
# 冲突策略: GitCode 侧历史可能与 GitHub 分叉 (双平台各自提交),
#           push 一律 --force-with-lease, 失败先 fetch + merge -X ours 再重试。
# 依赖: secrets.GC_TOKEN (GitCode PAT, 需 read_api + write_repository)。
#       未配置时三个步骤都 warning 跳过并 exit 0, 不 fail 工作流。
name: gitcode-sync

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/**'
      - 'index.html'
      - 'sw.js'
      - 'stock-detail.js'
      - 'realtime.js'
  schedule:
    # 每 30 分钟兜底 (UTC; 2-8 点 = 北京时间 10-16 点, 覆盖盘中采集节奏)
    - cron: '*/30 2,3,4,5,6,7,8 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write   # 步骤 B 需要回 commit 到 GitHub

concurrency:
  group: gitcode-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync remote main
        run: |
          git fetch origin main
          git merge --ff-only origin/main || echo "already up to date"

      - name: Prepare GitCode remote
        env:
          GC_TOKEN: ${{ secrets.GC_TOKEN }}
        run: |
          if [ -z "$GC_TOKEN" ]; then
            echo "::warning::GC_TOKEN 未配置, 跳过 GitCode 同步 (A/B/C 三个步骤都不会执行)"
            echo "配置方法: Settings → Secrets → New repository secret → Name: GC_TOKEN"
            echo "  Value: <gitcode personal access token> (需要 read_api + write_repository)"
            echo "GC_SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          git remote add gitcode "https://x-access-token:${GC_TOKEN}@gitcode.com/dufuwuxin/stock-system.git" 2>/dev/null || \
            git remote set-url gitcode "https://x-access-token:${GC_TOKEN}@gitcode.com/dufuwuxin/stock-system.git"
          git fetch gitcode main || { echo "::error::GitCode fetch 失败 (token 权限不足或仓库不可达)"; echo "GC_SKIP=1" >> "$GITHUB_ENV"; }
          echo "✓ GitCode remote ready"

      # ─────────────────────────────────────────────────────────
      # 步骤 A: GitHub → GitCode 推送 data/ (数据镜像)
      # ─────────────────────────────────────────────────────────
      - name: Step A - push data/ to GitCode
        if: env.GC_SKIP != '1'
        run: |
          ts=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          git config user.name "stocks-sync-bot"
          git config user.email "3576982374@qq.com"

          n_data=$(git ls-files data/ | grep -c '\.json$' || true)
          echo "data/*.json 共 $n_data 个待镜像"

          git add -A data/ index.html sw.js stock-detail.js realtime.js 2>/dev/null || true
          if git diff --cached --quiet HEAD; then
            echo "no data changes to mirror (GitCode 已是最新)"
          else
            git commit -m "mirror(data): $ts (GitHub → GitCode 数据镜像)" || true
            echo "committed: $(git rev-parse --short HEAD)"
          fi

          # GitCode 侧允许历史分叉, force-with-lease 保护远端他人提交
          if ! git push gitcode HEAD:main --force-with-lease; then
            echo "::warning::push 被拒绝 (GitCode 侧分叉), fetch + merge -X ours 后重试"
            git fetch gitcode main || true
            git merge --no-edit gitcode/main -X ours || true
            git push gitcode HEAD:main --force-with-lease || \
              echo "::error::步骤 A 失败: GitCode data/ 镜像未更新 (检查 token 的 write_repository 权限)"
          fi
          echo "✅ 步骤 A 完成: https://gitcode.com/dufuwuxin/stock-system/tree/main/data"

      # ─────────────────────────────────────────────────────────
      # 步骤 B: GitCode → GitHub 拉回 engines/ 新引擎到 scripts/
      #   实现 GitCode 侧云容器/上游产出的引擎回流, 自动 commit 回 GitHub
      # ─────────────────────────────────────────────────────────
      - name: Step B - pull new engines from GitCode
        if: env.GC_SKIP != '1'
        run: |
          pulled=0
          mkdir -p scripts

          # GitCode 侧 engines/ + algorithms/ 下的 .py, engines/ 同名优先
          for f in $(git ls-tree -r --name-only gitcode/main | grep -E '^(engines|algorithms)/[^/]+\.py$'); do
            base=$(basename "$f")
            if [ -e "scripts/$base" ]; then
              continue   # GitHub 已有同名文件, 不覆盖 (GitHub 为权威版本)
            fi
            {
              echo "# ═══ 来源: GitCode dufuwuxin/stock-system · $f ═══"
              echo "# 上游: gitcode/main  · 回流时间: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
              echo "# 该文件由 GitCode 侧维护 (云容器/上游引擎), GitHub 仅作镜像; 改动请同步回上游。"
              echo ""
              git show "gitcode/main:$f"
            } > "scripts/$base"
            echo "  ← $f -> scripts/$base"
            pulled=$((pulled + 1))
          done

          if [ "$pulled" -eq 0 ]; then
            echo "GitCode engines/ 无 GitHub 缺失的新引擎 (共有文件不覆盖)"
          else
            echo "本次回流 $pulled 个引擎"
            git add scripts/
            if git diff --cached --quiet HEAD; then
              echo "无实际变化"
            else
              git commit -m "feat(engines): 回流 GitCode 新增引擎 $pulled 个 ($(TZ=Asia/Shanghai date '+%m-%d %H:%M'))" || true
              git push origin HEAD:main || echo "::warning::引擎回推 GitHub 失败 (可能并发 push)"
              echo "✅ 步骤 B 完成: 已 commit 并 push 回 GitHub"
            fi
          fi

      # ─────────────────────────────────────────────────────────
      # 步骤 C: GitHub scripts/*.py → GitCode Space 触发引擎同步
      #   2026-10-14 改: 不再把 108 个脚本整体镜像到 engines/ (与 Space 的
      #   运行时 GitHub raw 拉取重复, 且镜像曾滞后导致 Space 跑旧代码)。
      #   Space 的 sync_engines() 每次跑链前从 GitHub raw 拉脚本, GitHub
      #   scripts/ 是唯一事实源。这里只 push 一个版本戳, 供 Space 面板展示。
      # ─────────────────────────────────────────────────────────
      - name: Step C - stamp engine version for Space
        if: env.GC_SKIP != '1'
        run: |
          ts=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')
          sha=$(git rev-parse --short HEAD)
          n_scripts=$(ls scripts/*.py 2>/dev/null | wc -l)
          mkdir -p /tmp/space-stamp
          cat > /tmp/space-stamp/engine_version.json <<JSON
          {
            "source": "github:qwerzxcva/stocks-ai-view",
            "commit": "$sha",
            "scripts": $n_scripts,
            "stamped_at": "$ts",
            "note": "Space pulls scripts from GitHub raw at runtime; this file is a version stamp only"
          }
          JSON
          echo "引擎版本戳: commit=$sha scripts=$n_scripts"

          git remote add space "https://x-access-token:${GC_TOKEN}@gitcode.com/jiegengxiangjianxue/stocks-ai-space.git" 2>/dev/null || \
            git remote set-url space "https://x-access-token:${GC_TOKEN}@gitcode.com/jiegengxiangjianxue/stocks-ai-space.git"
          if git fetch space main 2>/dev/null; then
            wt=".space-worktree"
            rm -rf "$wt"
            git worktree add --detach "$wt" space/main 2>/dev/null || {
              echo "::warning::worktree 失败, 跳过版本戳推送"; git worktree prune; exit 0;
            }
            mkdir -p "$wt"
            cp /tmp/space-stamp/engine_version.json "$wt/engine_version.json"
            cd "$wt"
            git add engine_version.json
            if git diff --cached --quiet HEAD; then
              echo "版本戳无变化"
            else
              git -c user.name="stocks-sync-bot" -c user.email="3576982374@qq.com" \
                commit -m "stamp(engine): $sha ($n_scripts scripts) $ts" || true
              if ! git push space HEAD:main --force-with-lease; then
                echo "::warning::版本戳 push 被拒绝 (Space 侧分叉), 不影响引擎运行"
              else
                echo "✅ 步骤 C 完成: 版本戳已推送 Space"
              fi
            fi
            cd - > /dev/null
            git worktree remove --force "$wt" 2>/dev/null || true
            git worktree prune
          else
            echo "::warning::Space 仓 fetch 失败, 跳过版本戳 (引擎仍会从 GitHub raw 拉取)"
          fi

      # ─────────────────────────────────────────────────────────
      # 步骤 D: GitCode 云容器产出的分析结果 → GitHub data/gitcode_review/
      #   (保留原有反向链路: GitCode AI 复盘输入回供 GitHub Actions LLM 复盘)
      # ─────────────────────────────────────────────────────────
      - name: Step D - pull cloud analysis output from GitCode
        if: env.GC_SKIP != '1'
        run: |
          mkdir -p data/gitcode_review
          n=0
          for f in $(git ls-tree -r --name-only gitcode/main | grep -E '^analysis/(review_input|cloud)/' | tail -10); do
            git show "gitcode/main:$f" > "data/gitcode_review/$(basename "$f")" 2>/dev/null && {
              echo "  ← $f"
              n=$((n + 1))
            }
          done
          if [ "$n" -eq 0 ]; then
            echo "GitCode 侧暂无 analysis/review_input 或 analysis/cloud 产出"
          else
            git add -A data/gitcode_review/
            if ! git diff --cached --quiet HEAD; then
              git commit -m "sync: 拉取 GitCode 云容器产出 $n 个文件 ($(TZ=Asia/Shanghai date '+%m-%d %H:%M'))" || true
              git push origin HEAD:main || echo "::warning::回推 GitHub 失败 (可能并发)"
              echo "✅ 步骤 D 完成: $n 个文件 -> data/gitcode_review/"
            fi
          fi
