# 池子数据自动重建 (板块池/周期池/低位池/周期深析)
# 盘中加密运行 (用户要求周期池/热点池实时更新)
#   CST 09:40 / 10:20 / 10:50 / 11:20 / 11:50
#        13:20 / 13:50 / 14:20 / 14:50
#   收盘 15:20 定格 + 15:40 补充; 周一 07:00 重建全史统计
# 数据源: 腾讯证券 (零鉴权), 不依赖东财 (容器/GH runner 内东财常被 WAF 拦)
name: rebuild-pools
on:
  schedule:
    - cron: '40,20,50 1,3,5,6,7 * * 1-5'   # UTC → CST 09:40~15:50 盘中
    - cron: '40 7 * * 1-5'                  # CST 15:40 收盘定格
    - cron: '0 23 * * 0'                    # 周一 CST 07:00 全史重建
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      # job 级路径变量: 所有步骤都能读到 (此前只在 lowpool 步骤设, 导致
      # ban_prob 找不到 K 线 bulk 而算出 0 个涨停事件)
      STOCKS_KLINE_BULK: ${{ github.workspace }}/data-kline/bulk
      STOCKS_LIVE_MARKET: ${{ github.workspace }}/data-live/market
      STOCKS_LIVE_ROOT: ${{ github.workspace }}/data-live
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Sync remote main
        run: |
          git fetch origin main
          git merge --ff-only origin/main || echo "already up to date"


      # K线仓 (低位池需要历史K线; 大仓用 sparse-checkout 只取 bulk 目录)
      - name: Checkout kline repo (sparse)
        uses: actions/checkout@v4
        with:
          repository: qwerzxcva/stocks-data-kline
          token: ${{ secrets.GITHUB_TOKEN }}
          path: kline-repo
          sparse-checkout: |
            data/bulk
          sparse-checkout-cone-mode: false

      - name: Prepare bulk dir
        run: |
          mkdir -p data-kline/bulk
          cp -n kline-repo/data/bulk/* data-kline/bulk/ 2>/dev/null || true
          ls data-kline/bulk/ | head -5
          echo "bulk files: $(ls data-kline/bulk/ | wc -l)"

      - name: Checkout live repo (snapshot)
        uses: actions/checkout@v4
        with:
          repository: qwerzxcva/stocks-data-live
          token: ${{ secrets.GITHUB_TOKEN }}
          path: live-repo
          sparse-checkout: |
            data/market
          sparse-checkout-cone-mode: false

      - name: Prepare snapshot dir
        run: |
          mkdir -p data-live/market
          cp -n live-repo/data/market/snapshot_*.json data-live/market/ 2>/dev/null || true
          ls -la data-live/market/ | tail -3

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 全史统计缓存 (避免每天重拉 8000+ 根K线; key 按周轮换, 周一自动重建)
      - name: Restore cycle stats cache
        uses: actions/cache@v4
        with:
          path: /tmp/cycle_stats_cache.json
          key: cycle-stats-${{ github.run_number }}
          restore-keys: |
            cycle-stats-

      # 1) 板块池 + 周期池 (腾讯 mktHs + 指数日K)
      - name: Rebuild sector_pool + cycle
        run: |
          python3 scripts/rebuild_pools.py --out-dir data

      # 2) 低位池 (依赖 bulk K线 + 快照)
      - name: Rebuild lowpool
        env:
          STOCKS_KLINE_BULK: ${{ github.workspace }}/data-kline/bulk
          STOCKS_LIVE_MARKET: ${{ github.workspace }}/data-live/market
        run: |
          python3 scripts/build_lowpool.py --out data/lowpool.json

      # 2b) 强势股/龙虎榜/大宗交易 → 独立 enrich.json
      #     (不写进 latest.json, 避免被远端 local realtime sync 每10分钟冲掉)
      - name: Build enrich.json (强势股+龙虎榜+大宗)
        run: |
          python3 scripts/build_enrich.py || true

      # 3) 周期深析 (指数全史统计, 每周重算一次; 缓存复用其余天)
      - name: Cycle deep analysis
        run: |
          if [ "$(date +%u)" = "1" ]; then
            echo "周一: 强制重算全史统计"
            python3 scripts/cycle_deep.py --out data/cycle_deep.json --rebuild || true
          else
            python3 scripts/cycle_deep.py --out data/cycle_deep.json || true
          fi

      # 4) 市场增量数据 (跌停数修正/涨跌家数/两融/龙虎榜等同花顺东财)
      #    用 --merge 就地合并, 保留远端系统的其他模块
      - name: Merge market extras
        run: |
          if [ -f data/latest.json ]; then
            python3 scripts/collect_market_extras.py --merge data/latest.json || true
          fi

      # 4b) 打板概率 (实证统计: 次日涨停率/炸板率/期望收益 + 因子分层)
      - name: Build ban_prob
        run: |
          python3 scripts/ban_prob.py --out data/ban_prob.json || true
          python3 -c "import json;d=json.load(open('data/ban_prob.json'));print('  events:',d['sample']['n_zt_events'],'| 首板次日涨停率:',d['base']['by_lianban']['首板']['zt_next_rate'],'%')" || true

      # 4c) 搜索索引 (快照 → 全量股票/ETF; 兜底走 latest.json)
      - name: Build search index
        env:
          STOCKS_LIVE_MARKET: ${{ github.workspace }}/data-live/market
        run: |
          python3 scripts/build_search_index.py || echo "search_index build failed, keeping old"

      # 4) 数据瘦身
      - name: Slim latest.json
        run: |
          [ -f scripts/slim_latest.py ] && python3 scripts/slim_latest.py || true

      - name: Verify outputs
        run: |
          for f in sector_pool.json cycle.json lowpool.json; do
            if [ -f "data/$f" ]; then
              size=$(wc -c < "data/$f")
              echo "  data/$f = ${size}B"
              python3 -c "import json;json.load(open('data/$f'));print('    JSON valid')" || exit 1
            else
              echo "  data/$f MISSING"
            fi
          done

      - name: Commit & push
        run: |
          git config user.name "pool-bot"
          git config user.email "741059079@qq.com"
          git fetch origin main
          git reset --soft origin/main
          git add -A data/
          ts=$(TZ=Asia/Shanghai date '+%Y%m%d_%H%M')
          if git diff --quiet --cached HEAD; then
            echo "no changes"
          else
            git commit -m "pools: $ts"
          fi
          git push origin main || {
            echo "push raced, retrying after reset"
            git fetch origin main
            git reset --soft origin/main
            git add -A data/
            git commit -m "pools: $ts" 2>/dev/null || true
            git push origin main
          }

