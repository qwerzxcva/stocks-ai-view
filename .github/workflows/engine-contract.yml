# engine-contract.yml — 双端算法一致性契约闸门（PR / push 触发，不依赖行情采集）。
#
# 这个 workflow 只做一件事：证明「端上算的和云端算的是同一件事」，
# 以及「data/ 下的产物仍然符合注册表契约」。它不跑引擎全链（那要 6-9 分钟且需要
# 行情数据），所以能在每个 PR 上跑。
#
# 闸门，任一失败即红：
#   1.  engine_spec.py --check-products    产物字段/单写者（防 market_phase 被 demo 覆盖这类事故）
#   2.  engine_spec.py --verify            golden_v5（18 技术票）是否漂移
#   2b. engines_v2.py --verify             golden_v2（flow/tape/rotation/vol_target）是否漂移
#   2c. golden_21.py --verify              golden_21（21 票含 3 张云端外部票）是否漂移
#   2d. calibrate_risk_regime.py --verify  riskBudget/regime 校准参数是否漂移
#   2e. sync_parity_artifacts.py check     规格/parity 夹具是否被「非登记写入方」改过
#   3.  build_engine_manifest.py --check   参数文件指纹 vs 清单
#   4.  verify_engine_consistency.py       清单版本 vs 端上 EngineManifest.EXPECTED_VERSIONS
#
# 2e / 4 需要端上仓 skapp-app 在同级目录，本 workflow 自己检出它（path: skapp-app
# + 软链到 ../skapp-app）；检不出来就直接红，不再退回 ::notice:: 静默跳过。
name: engine-contract
on:
  push:
    paths:
      - 'scripts/**'
      - 'data/engine_spec.json'
      - 'data/parity/**'
      - 'data/engine_weights.json'
      - '.github/workflows/engine-contract.yml'
  pull_request:
    paths: ['scripts/**', 'data/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2e/4、4/4 要比对端上仓生成物与 EngineManifest，端上仓必须真的检出。
      # 缺 secret / 检出失败 → 本 workflow 直接红（刻意不设跳过分支）。
      - name: 前置检查 secrets.GH_TOKEN（读端上仓 skapp-app 用）
        env:
          SKAPP_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$SKAPP_TOKEN" ]; then
            echo "::error::缺少 secrets.GH_TOKEN：2e/4、4/4 需要读 jiegengxiangjianxue/skapp-app，未配置即失败"
            exit 1
          fi

      # 端上仓：2e/4 归属校验、4/4 版本比对、矩阵里的 10 项 parity.* 都要读它。
      # 取不到就**硬失败**：2026-10-29 旧 secret 无读权限时，这一步 404 被
      # continue-on-error 掩成「夹具缺失」，整片 parity.* 红而根因看不出来（docs §12.4）。
      - uses: actions/checkout@v4
        with:
          repository: jiegengxiangjianxue/skapp-app
          token: ${{ secrets.GH_TOKEN }}
          path: skapp-app
          fetch-depth: 1

      # 脚本按「与本仓同级」定位端上仓（sync_parity_artifacts.py、verify_engine_consistency.py），
      # checkout 只能落在 workspace 内，故软链到上一级。
      - name: 端上仓就位（../skapp-app）
        run: |
          test -d "$GITHUB_WORKSPACE/skapp-app/testdata/parity" || {
            echo "::error::端上仓 skapp-app 未检出或缺 testdata/parity（查 secrets.GH_TOKEN 对 jiegengxiangjianxue/skapp-app 的读权限）"
            exit 1
          }
          ln -sfn "$GITHUB_WORKSPACE/skapp-app" ../skapp-app
          test -d ../skapp-app/testdata/parity

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 只装脚本真正 import 的东西；引擎本体是纯标准库 + pandas（rps_rotation）
      - name: Install deps
        run: pip install --quiet pandas || echo "pandas skipped (非必需)"

      # 2/4 不再检出 K 线分片：黄金向量自带 130 根 K 线，engine_spec.py --verify 从内嵌 bars
      # 重算。之前从分片重算，只要 CI 拿到的分片快照与生成时不同就报「漂移 72 处」——
      # 那是数据快照差异，不是参考实现漂移（2026-10-29 实测的假红，见 docs §10.6）。

      # 逐项矩阵：把原来 4 个聚合步骤拆成 ~88 个独立判定（逐用例 / 逐产物 / 逐文件）。
      # 聚合步骤的毛病是「一红全 skip，一次运行只能问出一个问题」，而且红了只知道
      # 「vol_target 那段漂了」，不知道是哪条用例哪个字段。矩阵里每项独立，一部分红不影响
      # 其余项出结论，失败项会逐条列出（见 docs §10.6）。
      - name: 1/3 语法检查（scripts/ 全量编译）
        run: |
          python3 -m compileall -q scripts/ >/dev/null && echo "compileall ok"

      - name: 2/3 细粒度闸门矩阵（逐用例 / 逐产物 / 逐文件）
        run: |
          test -f data/parity/golden_v5.json  || { echo "::error::缺少 data/parity/golden_v5.json"; exit 1; }
          test -f data/parity/golden_v2.json  || { echo "::error::缺少 data/parity/golden_v2.json"; exit 1; }
          test -f data/parity/golden_21.json  || { echo "::error::缺少 data/parity/golden_21.json"; exit 1; }
          test -d ../skapp-app || { echo "::error::端上仓 skapp-app 未检出（检查 checkout 步骤与 secrets.GH_TOKEN）"; exit 1; }
          python3 scripts/parity_matrix.py

      - name: 3/3 单独复述唯一写入方的整体判定
        run: python3 scripts/sync_parity_artifacts.py check

