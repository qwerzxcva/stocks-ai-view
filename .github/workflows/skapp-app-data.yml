name: skapp-app-data
# skapp Android app 供数 workflow:
#   - data/data/*.json     app 实际读取的四个文件(双 data 路径, pctChg 别名)
#   - data/api/*           HTTP 风格的静态 API: market / stocks/<code> / qa/<code>
#   - AI 问答: GitCode 免费 AI (deepseek-ai/DeepSeek-V4-Flash, 备选 Qwen3-30B), 每次增量 QA_BATCH 只股票, 只基于真实数据
# 频率: 每 10 分钟(GitHub cron 最快 5 分钟; 站点主链 A=mod5=2, 此处独立不冲突)
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      qa_batch:
        description: '本轮 AI 问答生成股票数(增量)'
        default: '6'
permissions:
  contents: write
  actions: write   # 唤醒 engine-chain 用
concurrency:
  group: skapp-app-data
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Sync remote main
        run: |
          git fetch origin main
          git merge --ff-only origin/main || echo "already up to date"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wake engine-chain (this repo's cron is rate-limited)
        env:
          GH_TOKEN: ${{ secrets.GHUB_TOKEN }}
        run: |
          # 背景: 本仓 cron 有软限流, scheduler.yml(心跳) 曾静默停跑 4.5 小时,
          #   导致 engine-chain 无人唤醒、引擎数据冻在 14:07 (2026-10-21 实测)。
          #   skapp-app-data 自身 cron 稳定, 由它顺带唤醒 engine-chain,
          #   不依赖 scheduler 这条链。engine-chain 自带时间窗/年龄守卫,
          #   盘中跑 light、盘后跑 full, 重复唤醒是安全的。
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/engine-chain.yml/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}")
          echo "engine-chain dispatch http=$code"
          # 204=已唤醒; 404=工作流不存在; 其它(如并发上限)不阻断本 job
          case "$code" in
            204) echo "woke engine-chain" ;;
            404) echo "::warning::engine-chain.yml 不存在" ;;
            *)   echo "::warning::engine-chain dispatch http=$code (忽略, 下游有自己的 cron 兜底)" ;;
          esac

      - name: Refresh board constituents (local-first source for api/sectors.json)
        # 东财 push2delay 会瞬断限流，部分失败属数据源限流而非代码 bug；
        # 失败时 api/sectors.json 会以 status=degraded/stale 如实标注，不冒充当日。
        continue-on-error: true
        run: python3 scripts/refresh_board_constituents.py --workers 2

      - name: Build app data + API + AI Q&A
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GC_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          QA_BATCH: ${{ github.event.inputs.qa_batch || '6' }}
        run: python3 scripts/skapp_app_data.py
      - name: Commit & push (targeted paths only)
        run: |
          python3 scripts/git_push_retry.py --msg "skapp app data $(date -u +%FT%TZ)" \
            --dir data/data --dir data/api --dir data/sector --user skapp-bot \
            --protect data/data/decision.json --protect data/data/today_picks.json \
            --protect data/data/stock_names.json --protect data/api/index.json \
            --protect data/api/market.json --protect data/api/qa --protect data/api/stocks \
            --protect data/api/news.json --protect data/api/sectors.json
