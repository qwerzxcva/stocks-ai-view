# full-pipeline — GitHub Actions 侧只做「采集 + 持久化 + 触发」
# 交易日盘中 5 次 (CST 09:50 / 10:50 / 11:50 / 13:50 / 14:50)
#
# 2026-10-14 职责重划 (用户要求: 算法与引擎全部在云端跑通整套流程):
#   Actions (本工作流) : 采集 → 合并去重 → DuckDB → 预测快照落盘 → push
#   GitCode Space     : 拉数据 → 跑 10 个引擎 → 产出回推 (见 space-pull.yml)
#
# 为什么把计算搬走:
#   - Actions 有 6h/次上限与每月 2000 分钟额度, 37 步全跑既慢又容易超时
#   - Space 有独立 1000 核时/月额度, 常驻不占 Actions 配额
#   - 引擎代码唯一事实源是 scripts/, Space 运行时从 GitHub raw 拉取
#
# 本工作流保留在 Actions 的原因:
#   - collect_all_sources 要多个出口 IP 采国内源 (容器内被墙的源)
#   - DuckDB 导入/压测是采集侧的质量门, 不是业务计算
#   - data/predictions/ 快照必须由 Actions 落盘 (复盘闭环的时间基准)
name: full-pipeline
on:
  schedule:
    # 交易时段每 10 分钟 (UTC 1,2,3,5,6,7 时的 0/10/20/30/40 分
    # = CST 09:00-15:50 的 :00/:10/:20/:30/:40)。原先是每 60 分钟一次
    # (只在 :50), 盘中数据最多陈旧 1 小时, 用户看到的是过期行情。
    - cron: '0,10,20,30,40,50 1,2,3,5,6,7 * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai
      STOCKS_DB: ${{ github.workspace }}/stocks.duckdb
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Sync remote main
        run: |
          git fetch origin main
          git merge --ff-only origin/main || echo "already up to date"

      - name: Checkout kline repo (sparse)
        uses: actions/checkout@v4
        with:
          repository: qwerzxcva/stocks-data-kline
          token: ${{ secrets.GITHUB_TOKEN }}
          path: kline-repo
          sparse-checkout: |
            data/bulk
          sparse-checkout-cone-mode: false

      - name: Link kline bulk
        run: |
          mkdir -p ../stocks-data-kline/data
          cp -r kline-repo/data/bulk ../stocks-data-kline/data/ 2>/dev/null || true
          echo "bulk files: $(ls ../stocks-data-kline/data/bulk/ | wc -l)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install duckdb
        run: pip install duckdb -q

      # ── 1. 数据源注册表快照 ──
      - name: Snapshot sources registry
        run: |
          python3 scripts/sources_registry.py --json data/sources_registry.json

      # ── 2. 并发采集 + 合并去重 ──
      - name: Collect all sources
        run: |
          python3 scripts/collect_all_sources.py --out /tmp/collected.json --workers 8

      # ── 3. 数据库导入 (采集侧质量门) ──
      - name: Init DB + load
        run: |
          python3 scripts/db_layer.py --init
          python3 scripts/db_layer.py --load /tmp/collected.json

      - name: Query benchmark
        run: python3 scripts/db_layer.py --bench 2>&1 | tee /tmp/bench.txt

      # ── 4. 合并去重结果落盘 (供前端查询 + Space 引擎消费) ──
      - name: Save merged sources to data/
        run: |
          cp /tmp/collected.json data/all_sources.json
          python3 - <<'PY'
          import json
          d = json.load(open('data/all_sources.json'))
          s = d['summary']
          print(f"data/all_sources.json: raw={s['total_raw']} merged={s['total_merged']} groups={list(s['groups'].keys())}")
          PY

      # ── 4b. 生成 24h 热点资讯流 (前端 news_digest.json) ─────────
      # 仓库里此前没有任何脚本生成 news_digest.json, 只有消费方
      # (index.html renderNews), 导致该面板永远停在最后一次本地手跑的时间
      # (线上实测 2026-10-13 08:30, 20 小时不更新)。
      # 必须在 Collect all sources 之后: 输入是 all_sources.json 的 news 组。
      - name: Build news digest
        run: |
          python3 scripts/build_news_digest.py --keep-hours 24 || \
            echo "::warning::news_digest 生成失败, 保留上一版"

      # ── 5. 预测快照持久化 ─────────────────────────────────────
      # 复盘闭环的时间基准: 今天存, 明天验证 1 日, 后天验证 3 日…
      # 文件名必须是 engine_v5_<date>.json — reflect_engine 用
      #   glob('engine_v5*.json') 匹配, kline_sim 用
      #   glob('engine_v5_*.json') 匹配, 改名会让两边都读不到。
      # 快照由 Space 引擎链产出 engine_v5.json 后, 由本工作流拷贝而来;
      # 若 Space 尚未产出, 则用采集行情构造一个最小快照 (保住时间基准)。
      - name: Persist prediction snapshot
        run: |
          mkdir -p data/predictions
          ts=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          if [ -f data/engine_v5.json ]; then
            # Space 已算出当日评分 → 直接快照 (复盘要的 top/votes 都在)
            cp data/engine_v5.json "data/predictions/engine_v5_${ts}.json"
            echo "prediction snapshot <- engine_v5.json ($(ls -la data/engine_v5.json | awk '{print $5}') bytes)"
          else
            echo "::notice::engine_v5.json 尚未生成 (Space 未跑), 本次不建快照"
          fi
          echo "predictions/: $(ls data/predictions | wc -l) 份"

      # ── 6. 全局 FX (轻量, 前端常驻展示) ──
      - name: Global FX
        run: python3 scripts/build_global_fx.py --out data/global_fx.json || true

      # ── 6b. 样本均衡 (EB 收缩: 修复连板层级 99.7% 样本集中首板) ──
      - name: Sample balancer
        run: python3 scripts/sample_balancer.py --write-back || echo "balancer skipped (no ban_prob)"

      # ── 6c. 场景化推股 (四象限: 牛/熊/震荡/极端) ──
      # 轻量 (只读已有 json 重排), GitHub 侧直接跑, 不等 Space
      - name: Scenario engine
        run: python3 scripts/scenario_engine.py || echo "scenario skipped (no multidim)"

      # ── 6c2. 权重校准 (特征重要性 → engine_v5 权重, 防过拟合) ──
      - name: Weight calibrator
        run: python3 scripts/weight_calibrator.py || echo "calibrator skipped (no reflect)"

      # ── 6c3. 信号审核 (发布前: 逻辑矛盾/数值异常/集中度/翻烧饼) ──
      - name: Signal auditor
        run: python3 scripts/signal_auditor.py || echo "auditor skipped (no decision)"

      # ── 6c4. 优势挖掘 (找优点: 指标/环境/维度 的统计显著优势) ──
      - name: Edge miner
        run: python3 scripts/edge_miner.py || echo "edge_miner skipped"

      # ── 6c5. 异常检测 (时序/分布: 数据断更/覆盖下跌/分布漂移) ──
      - name: Anomaly detector
        run: python3 scripts/anomaly_detector.py || echo "anomaly skipped"

      # ── 6d. 引擎兜底 (Space 未激活时, GitHub 侧跑轻量引擎链) ──
      # 主算力在 GitCode Space; 若 Space 未跑 (无 GC_TOKEN/未激活),
      # 这里跑一遍轻量引擎, 保证网站永远有最新评分/决策/估值。
      # ── 6e. 引擎兜底链 (Space 未激活时, Actions 自己跑全套) ──────
      # 主算力设计在 GitCode Space (1000 核时/月)。但 Space 需要人工在网页
      # 激活并选服务器配置; 未激活时 space-pull 拉不到任何产出, 网站就会
      # 一直是旧数据。所以这里放一份**完整**引擎链作兜底:
      #   · Space 已激活 → space-pull 拉回更新鲜的产出, 覆盖这里的
      #   · Space 未激活 → 这里的产出就是网站的数据源
      # 两个工作流写同一批文件, 但都在自己 commit 前 fetch+reset --soft,
      # 后跑的覆盖先跑的, 不会写坏。
      #
      # 与 Space ENGINE_CHAIN 保持同一套脚本/参数 (单一事实源 = scripts/)。
      # 单个引擎失败不阻断后面 (|| echo), 也不让整个 job 失败。
      - name: Engine chain (fallback when Space inactive)
        run: |
          set +e
          echo "--- tier 0: valuation + market phase ---"
          python3 scripts/valuation_engine.py --inject || echo "valuation skipped"
          python3 scripts/phase_runner.py --days 90 --out data/market_phase.json || echo "phase skipped"
          echo "--- tier 1: technical + picks + rotation ---"
          python3 scripts/engine_v5.py --out data/engine_v5.json --limit 500 || echo "engine_v5 skipped"
          python3 scripts/ai_pick_v4.py --out data/ai_pick_v4.json || echo "ai_pick_v4 skipped"
          python3 scripts/rps_rotation.py --top 30 --out data/rps_rotation.json || echo "rps skipped"
          echo "--- tier 2: factors + decision + limit-up audit + patterns ---"
          python3 scripts/multidim_engine.py --out data/multidim.json --limit 300 || echo "multidim skipped"
          python3 scripts/decision_engine.py --out data/decision.json || echo "decision skipped"
          python3 scripts/ban_prob.py --out data/ban_prob.json || echo "ban_prob skipped"
          python3 scripts/ban_pick.py --out data/ban_pick.json || echo "ban_pick skipped"
          python3 scripts/patterns.py --out data/patterns_smoke.json || echo "patterns skipped"
          echo "--- tier 3: backtest + reflection + winrate ---"
          python3 scripts/kline_sim.py --source predictions --out data/kline_sim.json --days 1,3,5,10 --slip-pct 0.03 || echo "kline_sim skipped"
          python3 scripts/reflect_engine.py --pred-dir data/predictions --horizons 1,3,5,10 --out data/reflect_latest.json || echo "reflect skipped"
          python3 scripts/winrate_matrix.py --out data/winrate_matrix.json || echo "winrate skipped"
          echo "--- tier 4: features + sample balance + loss attribution ---"
          python3 scripts/factor_lib.py --out data/factor_smoke.json || echo "factor_lib skipped"
          python3 scripts/sample_balancer.py --in data/ban_prob.json --out data/sample_balance.json || echo "balancer skipped"
          python3 scripts/loss_attribution.py || echo "loss_attribution skipped (no pick ledger)"
          echo "--- tier 5: calibration + audit + self-improvement ---"
          python3 scripts/weight_calibrator.py || echo "calibrator skipped"
          python3 scripts/edge_miner.py || echo "edge_miner skipped"
          python3 scripts/numeric_validator.py --out data/validation_report.json || echo "validator skipped"
          python3 scripts/scenario_engine.py || echo "scenario skipped"
          python3 scripts/signal_auditor.py || echo "auditor skipped"
          python3 scripts/anomaly_detector.py || echo "anomaly skipped"
          python3 scripts/self_reflect.py --out data/self_reflect.json || echo "self_reflect skipped"
          echo "--- engine chain done ---"

      # ── 7. 数据校验 (采集侧) ──
      - name: Audit collected data
        run: |
          python3 scripts/audit_data.py > data/audit_data_report.txt 2>&1 || true
          python3 scripts/numeric_validator.py --out data/validation_report.json || true

      # ── 8. 触发 Space 跑引擎链 ────────────────────────────────
      # Space 的 auto_sync_loop 每 30 分钟会自己拉取; 这里额外 curl /health
      # 一是保活 (防 30 分钟休眠), 二是让本次新采集的数据尽快被引擎消费。
      - name: Wake Space engine
        continue-on-error: true
        env:
          GC_TOKEN: ${{ secrets.GC_TOKEN }}
        run: |
          if [ -z "$GC_TOKEN" ]; then
            echo "::notice::GC_TOKEN 未配置, Space 触发器跳过 (引擎仍按自身 30 分钟节奏跑)"
            exit 0
          fi
          # Space 运行地址: GitCode Space 详情页可查。未配置时静默跳过。
          SPACE_URL="${SPACE_URL:-}"
          if [ -z "$SPACE_URL" ]; then
            echo "::notice::SPACE_URL 未配置, 跳过主动唤醒 (等 Space 30 分钟自动拉取)"
            exit 0
          fi
          curl -sf --max-time 15 "$SPACE_URL/health" >/dev/null 2>&1 \
            && echo "Space health OK" || echo "::warning::Space health 失败 (不影响采集)"

      # ── 9. 采集摘要 ──
      - name: Summary
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/collected.json'))
          s = d['summary']
          print('## full-pipeline 采集摘要 (计算引擎已移至 GitCode Space)')
          print(f"- 源: {s['registry']}")
          print(f"- 原始 {s['total_raw']} → 合并 {s['total_merged']} (去重 {s['dedup_removed']})")
          print(f"- 冲突 {s['conflicts']} 个, 错误 {len(s['errors'])} 个")
          print(f"- 耗时 {s['elapsed_s']}s")
          for g, v in s['groups'].items():
              print(f"  - {g}: {v['raw']} → {v['merged']}")
          PY

      # ── 10. 提交 ──────────────────────────────────────────────
      # 只提交采集侧产物。引擎产出 (engine_v5/multidim/decision/reflect/
      # kline_sim/self_reflect/valuation/…) 由 space-pull.yml 拉回后提交,
      # 两个工作流写不同的文件, 不会互相覆盖。
      #
      # 用 "git add -A -- <存在的路径>" 而非直接 add 字面量:
      #   `git add` 遇到不存在的 pathspec 会 fatal 退出 (exit 1),
      #   曾导致每次 pipeline 都在最后一步崩掉, 采集成果全部丢失
      #   (2026-10-13 20:57 与 2026-10-14 05:12 两次 run 均因此失败)。
      - name: Commit & push
        run: |
          git config user.name "pipeline-bot"
          git config user.email "741059079@qq.com"
          # 采集侧产物白名单 (引擎产出由 space-pull.yml 负责)
          FILES="data/sources_registry.json data/all_sources.json data/news_digest.json data/predictions data/global_fx.json data/audit_data_report.txt data/ban_prob.json data/ban_prob_balanced.json data/validation_report.json data/scenario.json data/engine_weights.json data/weights_history.json data/signal_audit.json data/edge_report.json data/anomaly_report.json data/multidim.json data/decision.json data/self_reflect.json data/valuation.json data/market_phase.json data/engine_v5.json data/ai_pick_v4.json data/rps_rotation.json data/ban_pick.json data/patterns_smoke.json data/kline_sim.json data/reflect_latest.json data/winrate_matrix.json data/factor_smoke.json data/sample_balance.json data/loss_attribution.json"
          # 只保留真实存在的路径, 避免 add 不存在的文件导致 fatal
          EXIST=""
          for f in $FILES; do
            if [ -e "$f" ]; then EXIST="$EXIST $f"; else echo "skip (not generated): $f"; fi
          done
          echo "staging:$EXIST"
          git fetch origin main
          git reset --soft origin/main
          # shellcheck disable=SC2086
          git add -A -- $EXIST
          ts=$(TZ=Asia/Shanghai date '+%Y%m%d_%H%M')
          if git diff --cached --quiet HEAD; then
            echo "no changes"
          else
            git commit -m "pipeline(collect): $ts"
          fi
          git push origin main || {
            echo "push raced, retrying after reset"
            git fetch origin main
            git reset --soft origin/main
            # shellcheck disable=SC2086
            git add -A -- $EXIST
            git commit -m "pipeline(collect): $ts" 2>/dev/null || true
            git push origin main
          }
