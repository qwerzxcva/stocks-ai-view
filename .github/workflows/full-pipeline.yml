# full-pipeline — 采集 + 计算全链路 (GitHub Actions 一站式)
#
# 2026-10-14 职责收敛 (用户决定: 停用 GitCode Space, 全迁 GitHub Actions):
#   Actions (本工作流) : 采集 → 合并去重 → 26 引擎计算 → 产出 → push
#   GitCode            : 只留 4 个 dataset 仓做零核时归档 (dataset-archive.yml)
#
# 为什么不用 Space:
#   - Space 30 分钟无 HTTP 访问就休眠, 需人工网页激活, 无法自动开关
#   - 本仓是公开仓, Actions 免费无限分钟; 单轮实测 60s, 远低于 6h 上限
#   - 引擎代码唯一事实源是 scripts/, 无跨平台同步分叉问题
#
# 本工作流保留在 Actions 的原因:
#   - collect_all_sources 要多个出口 IP 采国内源 (容器内被墙的源)
#   - data/predictions/ 快照由本工作流落盘 (复盘闭环的时间基准)
name: full-pipeline
on:
  schedule:
    # 交易时段每 5 分钟 (UTC 1,2,3,5,6,7 时的 :02/:07/:12/...
    # = CST 09:02-15:57)。实测一整轮 (采集 ~12s + 22 引擎) 只要 ~60s,
    # 所以 5 分钟粒度有余量; 配 concurrency group 防止偶发慢轮自我重叠。
    # 2026-10-16 修: 补盘后/晚间/凌晨 (原 cron 只覆盖盘中, 盘后 17 小时
    #   停摆, market_now/hot_news 等停在昨天盘中)。
    #   UTC 1,2,3,5,6,7,8,9,10,11,12 = CST 09:02-20:57
    #   UTC 17 = CST 次日 01:02 (隔夜刷新)
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 1,2,3,5,6,7,8,9,10,11,12 * * *'
    - cron: '2 17 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
# 并发控制: 一轮完整链路 (采集 ~12s + 22 引擎) 实测 59 秒, 而心跳每 5 分钟
# 触发一次, 正常不会重叠。万一某轮变慢, cancel-in-progress=true 让新一轮
# 顶掉旧轮 — 实时数据场景下"最新的那轮"比"跑完旧轮"更有价值, 且旧的
# 写了半份 data/ 反而更糟。
concurrency:
  group: full-pipeline
  cancel-in-progress: true
jobs:
  pipeline:
    runs-on: ubuntu-latest
    # 一轮完整链路 (采集 ~12s + 26 引擎) 实测最长 ~20 分钟, 留 50% 余量
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
      STOCKS_DB: ${{ github.workspace }}/stocks.duckdb
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Sync remote main
        run: |
          git fetch origin main
          git merge --ff-only origin/main || echo "already up to date"

      - name: Checkout kline repo (sparse)
        uses: actions/checkout@v4
        with:
          repository: qwerzxcva/stocks-data-kline
          token: ${{ secrets.GITHUB_TOKEN }}
          path: kline-repo
          sparse-checkout: |
            data/bulk
          sparse-checkout-cone-mode: false

      - name: Link kline bulk
        run: |
          mkdir -p ../stocks-data-kline/data
          cp -r kline-repo/data/bulk ../stocks-data-kline/data/ 2>/dev/null || true
          echo "bulk files: $(ls ../stocks-data-kline/data/bulk/ | wc -l)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      # ── 1. 数据源注册表快照 ──
      - name: Snapshot sources registry
        run: |
          python3 scripts/sources_registry.py --json data/sources_registry.json

      # ── 2. 并发采集 + 合并去重 ──
      - name: Collect all sources
        run: |
          python3 scripts/collect_all_sources.py --out /tmp/collected.json --workers 8

      # ── 3. 数据库导入 (采集侧质量门) ──
      - name: Init DB + load
        run: |
          python3 scripts/db_layer.py --init
          python3 scripts/db_layer.py --load /tmp/collected.json

      - name: Query benchmark
        run: python3 scripts/db_layer.py --bench 2>&1 | tee /tmp/bench.txt

      # ── 4. 合并去重结果落盘 (供前端查询 + 引擎消费) ──
      - name: Save merged sources to data/
        run: |
          cp /tmp/collected.json data/all_sources.json
          python3 - <<'PY'
          import json
          d = json.load(open('data/all_sources.json'))
          s = d['summary']
          print(f"data/all_sources.json: raw={s['total_raw']} merged={s['total_merged']} groups={list(s['groups'].keys())}")
          PY

      # ── 4b. 生成 24h 热点资讯流 (前端 news_digest.json) ─────────
      # 仓库里此前没有任何脚本生成 news_digest.json, 只有消费方
      # (index.html renderNews), 导致该面板永远停在最后一次本地手跑的时间
      # (线上实测 2026-10-13 08:30, 20 小时不更新)。
      # 必须在 Collect all sources 之后: 输入是 all_sources.json 的 news 组。
      - name: Build news digest
        run: |
          python3 scripts/build_news_digest.py --keep-hours 24 || \
            echo "::warning::news_digest 生成失败, 保留上一版"

      # ── 5. 预测快照持久化 ─────────────────────────────────────
      # 复盘闭环的时间基准: 今天存, 明天验证 1 日, 后天验证 3 日…
      # 文件名必须是 engine_v5_<date>.json — reflect_engine 用
      #   glob('engine_v5*.json') 匹配, kline_sim 用
      #   glob('engine_v5_*.json') 匹配, 改名会让两边都读不到。
      # 快照由本工作流的引擎链产出 engine_v5.json 后拷贝而来;
      # 若 Space 尚未产出, 则用采集行情构造一个最小快照 (保住时间基准)。
      - name: Persist prediction snapshot
        run: |
          mkdir -p data/predictions
          ts=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          if [ -f data/engine_v5.json ]; then
            # 引擎链已算出当日评分 → 直接快照 (复盘要的 top/votes 都在)
            cp data/engine_v5.json "data/predictions/engine_v5_${ts}.json"
            echo "prediction snapshot <- engine_v5.json ($(ls -la data/engine_v5.json | awk '{print $5}') bytes)"
          else
            echo "::notice::engine_v5.json 尚未生成, 本次不建快照"
          fi
          echo "predictions/: $(ls data/predictions | wc -l) 份"

      # ── 6. 全局 FX (轻量, 前端常驻展示) ──
      - name: Global FX
        run: python3 scripts/build_global_fx.py --out data/global_fx.json || true

      # Engine steps (balancer / scenario / calibrator / auditor / edge miner /
      # anomaly) moved to engine-chain.yml. They were duplicated here, and the
      # old weight_calibrator overwrote engine_weights.json with the averaged
      # version that hides the bull/bear edge asymmetry. full-pipeline now only
      # collects; engine-chain.yml consumes the output right after.

      # ── 6d. 引擎计算链 (26 引擎, Actions 一站式跑完) ──────────────
      # 主算力设计在 GitCode Space (1000 核时/月)。但 Space 需要人工在网页
      # 激活并选服务器配置; 未激活时 space-pull 拉不到任何产出, 网站就会
      # 一直是旧数据。所以这里放一份**完整**引擎链作兜底:
      #   · Space 已激活 → space-pull 拉回更新鲜的产出, 覆盖这里的
      #   · Space 未激活 → 这里的产出就是网站的数据源
      # 两个工作流写同一批文件, 但都在自己 commit 前 fetch+reset --soft,
      # 后跑的覆盖先跑的, 不会写坏。
      # The engine chain lives in engine-chain.yml (38 engines, tier 0-8).
      # It used to be duplicated here with an older tier 0-7 list, and the two
      # workflows overwrote each other's data/*.json. This workflow now only
      # collects; engine-chain.yml runs right after and consumes the output.

      # ── 6e. 瘦身预测快照 (votes 瘦成 dict, 107M -> 22M, 防仓库膨胀) ──
      - name: Slim prediction snapshots
        run: |
          python3 scripts/slim_predictions.py --dir data/predictions || echo "slim skipped"
          du -sh data/predictions/

      # ── 7. 数据校验 (采集侧) ──
      - name: Audit collected data
        run: |
          python3 scripts/audit_data.py > data/audit_data_report.txt 2>&1 || true
          python3 scripts/numeric_validator.py --out data/validation_report.json || true

      # ── 9. 采集摘要 ──
      - name: Summary
        run: |
          python3 - <<'PY'
          import json
          d = json.load(open('/tmp/collected.json'))
          s = d['summary']
          print('## full-pipeline 采集摘要 (计算引擎已移至 GitCode Space)')
          print(f"- 源: {s['registry']}")
          print(f"- 原始 {s['total_raw']} → 合并 {s['total_merged']} (去重 {s['dedup_removed']})")
          print(f"- 冲突 {s['conflicts']} 个, 错误 {len(s['errors'])} 个")
          print(f"- 耗时 {s['elapsed_s']}s")
          for g, v in s['groups'].items():
              print(f"  - {g}: {v['raw']} → {v['merged']}")
          PY

      # ── 10. 提交 ──────────────────────────────────────────────
      # 只提交采集侧产物。引擎产出 (engine_v5/multidim/decision/reflect/
      # kline_sim/self_reflect/valuation/…) 由 space-pull.yml 拉回后提交,
      # 两个工作流写不同的文件, 不会互相覆盖。
      #
      # 用 "git add -A -- <存在的路径>" 而非直接 add 字面量:
      #   `git add` 遇到不存在的 pathspec 会 fatal 退出 (exit 1),
      #   曾导致每次 pipeline 都在最后一步崩掉, 采集成果全部丢失
      #   (2026-10-13 20:57 与 2026-10-14 05:12 两次 run 均因此失败)。
      - name: Commit & push
        # 复用 scripts/git_push_retry.py: fetch+reset+add+commit+push,
        # push 失败退避 5/10/20/40s 重试最多 5 次。仓库有 6+ 个 bot 同时推
        # main, 单次重试在高峰期不够 — 曾出现工作流 success 但数据从未上台。
        # --protect 列出本轮刚生成的文件: 6 个工作流并发推 main 时,
        # 若不先把远端最新版取回工作区, 本 run 开始时的旧副本会把别的
        # 工作流刚推的新数据覆盖掉 (2026-10-14 实测: ai-update 推的 11:34
        # latest.json 被随后 4 个 run 覆盖回 10:49)。
        #
        # 本工作流现在只采集; 引擎产出全部由 engine-chain.yml 负责,
        # 所以 protect 列表只含采集侧文件 — 把引擎 json 也列进来会让
        # 本 run 用采集时的旧副本覆盖 engine-chain 刚推的新结果。
        run: |
          python3 scripts/git_push_retry.py --msg "pipeline(collect)" \
            data/sources_registry.json data/all_sources.json data/news_digest.json \
            data/predictions data/global_fx.json data/audit_data_report.txt \
            --protect data/sources_registry.json --protect data/all_sources.json \
            --protect data/news_digest.json --protect data/predictions \
            --protect data/global_fx.json --protect data/audit_data_report.txt
