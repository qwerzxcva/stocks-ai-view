name: research-evaluation

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/research_evaluation.py'
      - 'scripts/engine_v5.py'
      - 'scripts/engine_spec.py'
      - 'scripts/indicators_ext.py'
      - 'scripts/engines_v2.py'
      - 'data/engine_weights.json'
      - 'tests/test_research_evaluation.py'
      - '.github/workflows/research-evaluation.yml'
      - 'tests/fixtures/sh600519_gt.csv'
      - 'tests/fixtures/sz002242_gt.csv'
      - 'tests/fixtures/research/sh600519_benchmark.csv'
      - 'tests/fixtures/research/sz002242_benchmark.csv'

permissions:
  contents: read

concurrency:
  group: research-evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Research boundary regression tests
        run: python3 -m unittest discover -s tests -p test_research_evaluation.py -v
      - name: Evaluate real ground-truth CSVs without production writes
        run: |
          set -euo pipefail
          python3 scripts/research_evaluation.py \
            --approved-benchmarks \
            --input sh600519=tests/fixtures/research/sh600519_benchmark.csv \
            --input sz002242=tests/fixtures/research/sz002242_benchmark.csv \
            --cost-bps 0 \
            --output "$RUNNER_TEMP/research-evaluation.json"
          python3 - "$RUNNER_TEMP/research-evaluation.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert report["history_only"] is True
          assert report["spec_version"] == "3.3.0"
          assert set(report["sources"]) == {"sh600519", "sz002242"}
          assert all(source["row_count"] > 0 and source["sha256"] for source in report["sources"].values())
          assert all(source["benchmark_approved"] for source in report["sources"].values())
          assert report["status"] in {"history_only", "insufficient"}
          assert report["marketwide_evidence"]["status"] == "insufficient"
          print("Historical research only; not marketwide, real holdings or capacity evidence")
          print("status:", report["status"], "sample_count:", report["sample_count"], "reason:", report["reason"])
          # An honest insufficient report is an expected artifact, not a reason to relax the source gate.
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: research-evaluation-${{ github.sha }}
          path: ${{ runner.temp }}/research-evaluation.json
          if-no-files-found: error
          retention-days: 14
