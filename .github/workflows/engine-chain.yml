# engine-chain.yml — the whole engine chain in one workflow, on the Actions egress.
#
# This replaces the GitCode Space as the execution host. Space ran the same
# chain by pulling engine code from GitHub raw at runtime; Actions checks the
# code out directly, which is simpler and has no runtime dependency on a second
# platform. The repo is public, so Actions minutes are free and unmetered.
#
# Measured cost: ~6-9 minutes per full run (full-pipeline's own timings), well
# inside the 6-hour job limit.
#
# Ordering: engines run in tier order because each tier consumes the previous
# tier's output. A missing input skips just that engine (|| echo), never the
# rest of the chain.
#
# Required secret: GH_TOKEN, a PAT with repo scope. It is used to publish the
# results into jiegengxiangjianxue1/db-market, which is a different repo from
# this one, so the default GITHUB_TOKEN cannot do it.
name: engine-chain
on:
  schedule:
    # 09:05 CST weekdays: after the pre-open data lands, before the session
    - cron: '5 1 * * 1-5'
    # 15:30 CST weekdays: after the close and the 15:05 settle
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Run regardless of the time window'
        type: boolean
        default: false
      mode:
        description: 'Which tier list to run (only used with force)'
        type: choice
        options: [full, light]
        default: full
permissions:
  contents: read

concurrency:
  # one run at a time; the two cron ticks are 6.5h apart, but a manual dispatch
  # during a scheduled run should queue rather than interleave
  group: engine-chain
  cancel-in-progress: false

# The scheduler heartbeat wakes this every 5 minutes, but a full run takes ~2
# minutes and only means anything twice a day (pre-open and post-close). This
# guard skips the run outside those windows so the heartbeat does not queue up
# back-to-back chains all session long.
# Override with a workflow_dispatch input when you want it to run immediately.
env:
  TZ: Asia/Shanghai
  # GitCode 免费 AI 额度 (AI 复盘用); 未配置时 ai_review 自动跳过
  GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}

jobs:
  engines:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Shanghai
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      # GitCode 免费 AI 额度 (AI 复盘); 未配置时脚本自动跳过
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
      # job 级路径变量: 引擎链整段都要读。只在单步设的话, multidim 的
      # load_quote_index() 会因 SNAPSHOT_GLOB 落空而返回 {},
      # 表现为「快照0 基本面全 50」(2026-10-15 实测 run 38728026058)。
      STOCKS_LIVE_MARKET: ${{ github.workspace }}/stocks-data-live/market
      STOCKS_LIVE_ROOT: ${{ github.workspace }}/stocks-data-live
      FORCE_RUN: ${{ inputs.force }}
      FORCE_MODE: ${{ inputs.mode }}
    steps:
      - name: Time window guard
        run: |
          # The heartbeat wakes this every 5 min; a full chain only matters
          # pre-open (08:30-09:30) and post-close (15:05-16:30). Outside those
          # windows, skip so the heartbeat does not pile up runs all session.
          if [ "$FORCE_RUN" = "true" ]; then
            echo "MODE=${FORCE_MODE:-full}" >> "$GITHUB_ENV"
            echo "forced run, skipping the window check"; exit 0
          fi
          h=$(date +%H); m=$(date +%M); mins=$((10#$h * 60 + 10#$m))
          dow=$(date +%u)
          if [ "$dow" -gt 5 ]; then echo "weekend, skipping"; exit 1; fi
          # MODE decides which tier list the Engine chain step runs.
          #   light = the four engines the site reads directly (~65s measured)
          #   full  = the whole tier 0-8 chain (~6-9 min)
          #盘中 (09:15-15:10) 与盘前都跑 light; 盘后窗口跑 full。
          if [ "$mins" -ge 555 ] && [ "$mins" -le 910 ]; then
            echo "MODE=light" >> "$GITHUB_ENV"; echo "intraday window ($h:$m) -> light"; exit 0
          fi
          if [ "$mins" -ge 510 ] && [ "$mins" -le 570 ]; then
            echo "MODE=full" >> "$GITHUB_ENV"; echo "pre-open window ($h:$m) -> full"; exit 0
          fi
          if [ "$mins" -ge 905 ] && [ "$mins" -le 990 ]; then
            echo "MODE=full" >> "$GITHUB_ENV"; echo "post-close window ($h:$m) -> full"; exit 0
          fi
          echo "MODE=light" >> "$GITHUB_ENV"
          echo "outside the engine window ($h:$m) -> light"; exit 0

      # 必须传 PAT 而不是默认 GITHUB_TOKEN: actions/checkout 会用传入的
      # token 重写 git remote 的凭据。默认 GITHUB_TOKEN 受
      # `permissions: contents: read` 限制只有读权限, 用它 checkout 后
      # git_push_retry.py 的 git push 会稳定 403
      # (2026-10-15 实测: run 38724673649 / 38726480451 连续 12 次
      # attempt 全部 403, 6 个 protect 文件的成果全部推不上去)。
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Sync remote main
        run: |
          git fetch origin main
          git merge --ff-only origin/main || echo "already up to date"

      # The engines read bulk kline and the prediction history; both live in
      # other repos. Sparse-checkout keeps the download small.
      - name: Checkout kline repo (sparse)
        uses: actions/checkout@v4
        with:
          repository: qwerzxcva/stocks-data-kline
          token: ${{ secrets.GITHUB_TOKEN }}
          sparse-checkout: |
            data/bulk
            meta
          path: kline-repo

      - name: Link kline bulk + prediction history
        run: |
          mkdir -p ../stocks-data-kline
          cp -r kline-repo/data ../stocks-data-kline/ 2>/dev/null || true
          cp -r kline-repo/meta ../stocks-data-kline/ 2>/dev/null || true
          ls ../stocks-data-kline/data/bulk | head -3
          # 大分片在 git 里是 .csv.gz (54.6MB -> 15.7MB)。28 个引擎脚本都
          # glob 'day_qfq_*.csv', 所以这里解压到 bulk 目录, 让 glob 能命中。
          # 不解压的话 engine_v5 只加载 1677 只而不是 3997 只 (2026-10-15 实测)。
          python3 -c "
          import sys; sys.path.insert(0, 'scripts')
          from paths import ensure_bulk_uncompressed
          n = ensure_bulk_uncompressed('../stocks-data-kline/data/bulk')
          print(f'uncompressed {n} gz shards')
          "
          ls ../stocks-data-kline/data/bulk | grep -c 'day_qfq'

      # 腾讯全市场快照: multidim 的基本面维度 (PE/PB/市值) 读
      # SNAPSHOT_GLOB = $STOCKS_LIVE_MARKET/snapshot_*.json。不配这个
      # 环境变量、不拉 live 仓, load_quote_index() 返回空,
      # 表现为「快照0 基本面全 50」(2026-10-15 实测 run 38728026058)。
      - name: Checkout live repo (snapshot)
        uses: actions/checkout@v4
        with:
          repository: qwerzxcva/stocks-data-live
          token: ${{ secrets.GITHUB_TOKEN }}
          path: live-repo
          sparse-checkout: |
            data/market
          sparse-checkout-cone-mode: false

      - name: Prepare snapshot dir
        run: |
          mkdir -p ../stocks-data-live/market
          cp -n live-repo/data/market/snapshot_*.json ../stocks-data-live/market/ 2>/dev/null || true
          ls ../stocks-data-live/market/ | tail -3
          echo "snapshots: $(ls ../stocks-data-live/market/snapshot_*.json 2>/dev/null | wc -l)"
          # the ledger engines need wh/daily; pull it from the warehouse
          mkdir -p ../stockdb/wh/daily
          curl -s -H "Authorization: token ${GH_TOKEN}" \
            "https://api.github.com/repos/jiegengxiangjianxue1/db-market/contents/ledger/daily/2026.parquet" \
            | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          u=d.get('download_url')
          if u:
              open('/tmp/dl.txt','w').write(u)
              print('daily parquet url ok')
          else:
              print('no daily parquet:', d.get('message'))
          "
          if [ -f /tmp/dl.txt ]; then
            curl -s -L -H "Authorization: token ${GH_TOKEN}" "$(cat /tmp/dl.txt)" \
              -o ../stockdb/wh/daily/2026.parquet
            ls -la ../stockdb/wh/daily/
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -q requests akshare pandas lxml duckdb

      # ── the chain ──────────────────────────────────────────────
      - name: Engine chain (tier 0-8 / light)
        run: |
          set +e
          # MODE=light: 只跑网站直接消费的四个引擎 (实测本地 65s)。
          #   盘中每 5 分钟一轮, 保证 index.html 的 engine_v5 / decision /
          #   today_picks / ai_pick_v4 是几分钟内的新结果。
          # MODE=full: 盘前/盘后跑整条 tier 0-8 链 (~6-9 分钟)。
          if [ "$MODE" = "light" ]; then
            echo "--- light tier: valuation / engine_v5 / decision / today_picks / ai_pick_v4 / premarket ---"
            # valuation 提到 light: 它只跑 ~20s, 但产出被 premarket_picks /
            # multidim / ai_pick_v4 / decision 四个引擎依赖。此前只在 full 跑,
            # 导致盘中刷新时 valuation.json 停留在上一次 full 的快照
            # (实测只剩 6 条指数, 因为 full 那轮行情快照源失败)。
            python3 scripts/valuation_engine.py --out data/valuation.json || echo "valuation skipped"
            python3 scripts/engine_v5.py --out data/engine_v5.json --limit 2000 || echo "engine_v5 skipped"
            python3 scripts/decision_engine.py --out data/decision.json || echo "decision skipped"
            python3 scripts/build_today_picks.py --force || echo "build_today_picks skipped"
            python3 scripts/ai_pick_v4.py --out data/ai_pick_v4.json || echo "ai_pick_v4 skipped"
            # 早盘/午盘推股: 读上面所有产出, 叠加隔夜增量 + 市况闸门
            python3 scripts/premarket_picks.py --out data/premarket_picks.json || echo "premarket skipped"
            # 午盘: 上午 11:30 后验证早盘计划 + 给下午修正清单
            python3 scripts/midday_picks.py --out data/midday_picks.json || echo "midday skipped"
            echo "--- light tier done ---"
          fi

          if [ "$MODE" = "full" ]; then
          echo "--- tier 0: valuation + market phase ---"
          python3 scripts/valuation_engine.py --inject || echo "valuation skipped"
          python3 scripts/phase_runner.py --days 90 --out data/market_phase.json || echo "phase skipped"

          echo "--- tier 1: resonance + AI pick + rotation ---"
          python3 scripts/engine_v5.py --out data/engine_v5.json --limit 500 || echo "engine_v5 skipped"
          python3 scripts/ai_pick_v4.py --out data/ai_pick_v4.json || echo "ai_pick_v4 skipped"
          python3 scripts/rps_rotation.py --top 30 --out data/rps_rotation.json || echo "rps skipped"

          echo "--- tier 2: factors + decision + limit-up audit ---"
          # 板块资金 (东财行业主力净额): multidim 的板块面维度与
          # AI 复盘的【板块资金】节都读 latest.json.sector_moneyflow。
          # engine-chain 原先不跑 collect_market_extras, 该字段一直缺失,
          # 表现为「板块资金0」(2026-10-15 实测 run 38728026058)。
          python3 scripts/collect_market_extras.py --merge data/latest.json || echo "market_extras skipped"
          # 海外关联性 (大盘/板块 与 纳指/恒指/日经/KOSPI 的相关/贝塔/滞后/隔夜)
          # 必须在 multidim 之前: multidim 的「海外面」维度读它
          python3 scripts/overseas_linkage.py --out data/overseas_linkage.json || echo "linkage skipped"
          python3 scripts/multidim_engine.py --out data/multidim.json --limit 300 || echo "multidim skipped"
          python3 scripts/decision_engine.py --out data/decision.json || echo "decision skipped"
          python3 scripts/ban_prob.py --out data/ban_prob.json || echo "ban_prob skipped"
          python3 scripts/ban_pick.py --out data/ban_pick.json || echo "ban_pick skipped"
          python3 scripts/patterns.py --out data/patterns_smoke.json || echo "patterns skipped"
          python3 scripts/strategy_card.py || echo "strategy_card skipped"
          python3 scripts/engine_fusion.py || echo "engine_fusion skipped"

          echo "--- tier 3: backtest + reflection + winrate ---"
          python3 scripts/kline_sim.py --source predictions --out data/kline_sim.json --days 1,3,5,10 --max-signals 3000 || echo "kline_sim skipped"
          python3 scripts/reflect_engine.py --pred-dir data/predictions --horizons 1,3,5,10 --out data/reflect_latest.json || echo "reflect skipped"
          python3 scripts/winrate_matrix.py --out data/winrate_matrix.json || echo "winrate skipped"
          python3 scripts/walkforward.py --train-days 120 --test-days 20 --step-days 20 --horizon 5 --out data/walkforward.json || echo "walkforward skipped"

          echo "--- tier 4: factors + divergence + balance + attribution ---"
          python3 scripts/factor_lib.py --out data/factor_smoke.json || echo "factor_lib skipped"
          python3 scripts/flow_divergence.py --out data/flow_divergence.json || echo "flow_divergence skipped"
          python3 scripts/sample_balancer.py --in data/ban_prob.json --out data/ban_prob_balanced.json --write-back || echo "balancer skipped"
          python3 scripts/loss_attribution.py || echo "loss_attribution skipped"
          python3 scripts/pick_tracker.py stats || echo "pick_tracker skipped"

          echo "--- tier 5: calibration + edge + self-improvement ---"
          # v2 replaces the averaged calibrator: it scores bull and bear
          # separately, which is what exposed that every bull edge is negative
          python3 scripts/weight_calibrator_v2.py || echo "calibrator_v2 skipped"
          python3 scripts/edge_miner.py || echo "edge_miner skipped"
          python3 scripts/self_reflect.py --out data/self_reflect.json || echo "self_reflect skipped"

          echo "--- tier 6: validation + scenario + audit + risk ---"
          python3 scripts/numeric_validator.py --out data/validation_report.json || echo "validator skipped"
          python3 scripts/scenario_engine.py || echo "scenario skipped"
          python3 scripts/signal_auditor.py || echo "auditor skipped"
          python3 scripts/risk_engine.py || echo "risk skipped"

          echo "--- tier 7: portfolio + anomaly ---"
          python3 scripts/portfolio_optimizer.py || echo "portfolio skipped"
          python3 scripts/anomaly_detector.py || echo "anomaly skipped"

          echo "--- tier 8: session review + close review ---"
          python3 scripts/morning_review.py || echo "morning_review skipped"
          python3 scripts/review_yesterday.py || echo "review_yesterday skipped"
          python3 scripts/entry_planner.py || echo "entry_planner skipped"
          python3 scripts/afternoon_picks.py || echo "afternoon_picks skipped"
          python3 scripts/stop_analysis.py || echo "stop_analysis skipped"
          python3 scripts/build_today_picks.py --force || echo "build_today_picks skipped"
          python3 scripts/close_review.py || echo "close_review skipped"
          python3 scripts/archive_review.py || echo "archive_review skipped"
          # 早盘/午盘推股: 盘后跑一次, 让用户收盘后就能看到次日计划
          python3 scripts/premarket_picks.py --out data/premarket_picks.json || echo "premarket skipped"
          python3 scripts/midday_picks.py --out data/midday_picks.json || echo "midday skipped"

          # AI 复盘 (GitCode 免费 AI 额度): 把上面所有引擎产出喂给 LLM 写结构化复盘
          # 放在 tier 8 最后, 这样十维/海外关联/推股/收盘复盘全部就绪
          # 失败不影响其他管线 (token 缺失或额度用尽都只跳过)
          python3 scripts/gitcode_ai_review.py || echo "ai_review skipped (check GITCODE_TOKEN)"

          echo "--- engine chain done ---"
          fi

      # ── publish to the warehouse the site reads ──
      - name: Publish engine outputs to this repo
        run: |
          # 引擎产出必须先推回本仓 (GitHub Pages 的数据源), 再同步到数据仓。
          # light 档每 5 分钟跑一次, 用 git_push_retry 的 fetch+reset+protect
          # 避免和另外 6 个 bot 互相覆盖。
          python3 scripts/git_push_retry.py --msg "engine($MODE)" \
            data/engine_v5.json data/decision.json data/today_picks.json \
            data/ai_pick_v4.json data/valuation.json data/premarket_picks.json \
            data/midday_picks.json data/engine_fusion.json data/multidim.json \
            data/overseas_linkage.json data/ai_review.json data/ai_review.md \
            --user engine-bot \
            --protect data/engine_v5.json --protect data/decision.json \
            --protect data/today_picks.json --protect data/ai_pick_v4.json \
            --protect data/valuation.json --protect data/premarket_picks.json \
            --protect data/midday_picks.json \
            --protect data/engine_fusion.json --protect data/multidim.json \
            --protect data/overseas_linkage.json \
            --protect data/ai_review.json --protect data/ai_review.md

      - name: Publish to the data warehouse
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python3 scripts/sync_reviews.py || echo "sync_reviews failed (check GH_TOKEN)"
          python3 scripts/sync_repos.py --push || echo "sync_repos skipped"

      - name: Summary
        run: |
          echo "engine outputs:"
          for f in engine_v5 ai_pick_v4 multidim decision ban_pick reflect_latest \
                   engine_weights loss_attr engine_fusion strategy_card \
                   close_review stop_analysis entry_plans today_picks; do
            if [ -f "data/$f.json" ]; then
              printf "  %-20s %8s bytes\n" "$f.json" "$(stat -c%s data/$f.json)"
            fi
          done
          echo "archive:"
          wc -l data/review_history.jsonl 2>/dev/null || echo "  no archive"
