# 分片采集 — 三账号错峰 (GitHub Actions)
#
# 背景: GitHub-hosted runner 全在 Azure, 出口是数据中心段, 国内金融源
# (东财 push2/同花顺/雪球) 对这类 IP 一律按爬虫对待, 且按 IP 计数。
# 三个账号 = 三个独立出口 IP, 按源分片后单 IP 请求量降到 1/3,
# 且某个 IP 被封不影响其他分片。
#
# 分片定义见 scripts/sources_registry.py 的 SHARDS:
#   a (43) 主力稳定: 腾讯/新浪/集思璐/东财非push2域/海外/本地
#   b (8)  东财 push2 实时系 (最易被封, 独立 IP)
#   c (18) 交易所官方/同花顺/需 key
#   d (10) 需大陆出口 IP (只应在 GitCode Space 跑, 本 workflow 不跑)
#   e (6)  akshare/baostock 库
#
# 本文件是三账号共用的模板, 通过 repository 守卫 + 环境变量 SHARD 区分:
#   A 仓 (qwerzxcva)  → shard a + e, cron mod5=2
#   B 仓 (镜像)        → shard b,     cron mod5=4
#   C 仓 (镜像)        → shard c,     cron mod5=0
# 部署到 B/C 仓时把 SHARD 和 cron 改掉 (见 scripts/deploy_mirror.py)
name: shard-collect

on:
  schedule:
    # A 仓: mod5=2 (与 moneyflow-realtime 的 mod5=3 错开)
    # 部署到 B 仓改 mod5=4, C 仓改 mod5=0
    # 时段说明 (2026-10-16 修):
    #   原 cron 只覆盖 UTC 1,2,3,5,6,7 = CST 09:02-15:57, 即只在盘中跑。
    #   后果: 盘后 15:57 到次日 09:02 共 17 小时采集停摆,
    #   深夜/凌晨/周末看网站时 hot_news/news_extra/hot_themes 全是
    #   昨天盘中的数据 (实测 hot_news 停在 10-15 18:17, mainline 停在
    #   10-15 09:02, 用户反馈「热点数据没有更新过」)。
    #   现补 UTC 8,9,10 (= CST 16:02-18:57 盘后) 与 UTC 11,12 (= CST 19:02-20:57
    #   晚间), 以及 UTC 17 (= CST 次日 01:02 凌晨刷新),
    #   让热点/资讯在非交易时段也能跟上。UTC 0 与 4 仍跳过
    #   (UTC 0 = CST 08:00 盘前尚无新数据, UTC 4 = CST 12:00 与 UTC 3 重复)。
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 1,2,3,5,6,7,8,9,10,11,12 * * *'
    # 凌晨兜底: CST 01:02, 保证隔夜也有一轮新数据 (周末同样生效)
    - cron: '2 17 * * *'
  workflow_dispatch:
    inputs:
      shard:
        description: '覆盖默认分片 (留空用仓默认)'
        default: ''
      workers:
        description: '并发数'
        default: '6'

permissions:
  contents: write

concurrency:
  group: shard-collect
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Shanghai
      # 分片: A 仓默认 a+e (主力稳定 + 本地库, 不碰 push2)
      # B 仓部署时改成 b, C 仓改成 c
      SHARD: ${{ github.event.inputs.shard || 'a' }}
      SHARD_EXTRA: ${{ github.event.inputs.shard || 'e' }}
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Sync remote main
        run: |
          git fetch origin main
          git merge --ff-only origin/main || echo "already up to date"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -q duckdb numpy pandas
          # akshare 用于 sina_kline_daily / em_a_hist 两个 fetcher
          # (装失败不阻断 — fetcher 会优雅降级)
          pip install -q akshare || echo "::warning::akshare 装失败, 相关 fetcher 将降级"

      # ── 分片采集 ────────────────────────────────────────────
      # 每个 shard 独立输出文件 data/shard_<x>.json, 互不覆盖
      # (4 个节点写不同文件, merge 时无冲突; 前端按需读)
      - name: Collect shard ${{ env.SHARD }}
        run: |
          echo "=== shard: $SHARD (+$SHARD_EXTRA) ==="
          python3 scripts/collect_all_sources.py \
            --out /tmp/shard_main.json \
            --shard "$SHARD" \
            --workers ${{ github.event.inputs.workers || '6' }} \
            || echo "::warning::shard $SHARD 采集有失败, 保留已采部分"

          if [ "$SHARD_EXTRA" != "$SHARD" ]; then
            python3 scripts/collect_all_sources.py \
              --out /tmp/shard_extra.json \
              --shard "$SHARD_EXTRA" \
              --workers 4 \
              || echo "::warning::shard $SHARD_EXTRA 采集有失败"
          fi

      # ── 转成分片文件 (带 shard 元数据) ──────────────────────
      - name: Write shard outputs
        run: |
          python3 - <<'PY'
          import json, os, shutil
          shard = os.environ["SHARD"]
          extra = os.environ.get("SHARD_EXTRA", "")
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          os.makedirs("data", exist_ok=True)
          for src, tag in (("/tmp/shard_main.json", shard),
                           ("/tmp/shard_extra.json", extra)):
              if not os.path.exists(src):
                  continue
              try:
                  d = json.load(open(src, encoding="utf-8"))
              except Exception as e:
                  print("skip %s: %s" % (src, e))
                  continue
              # 记录是哪个仓/哪个分片产的, 便于审计与前端选择
              d["shard_meta"] = {
                  "shard": tag,
                  "repo": repo,
                  "generated": d.get("summary", {}).get("generated"),
              }
              out = "data/shard_%s.json" % tag
              with open(out, "w", encoding="utf-8") as f:
                  json.dump(d, f, ensure_ascii=False)
              print("wrote %s (%d bytes)" % (out, os.path.getsize(out)))
          PY

      # ── 新闻补充源 (早报 SSR + 华尔街见闻 JSON) ──────────────
      - name: Collect extra news
        run: |
          python3 scripts/collect_news_extra.py --out data/news_extra.json --limit 30 \
            || echo "::warning::news_extra 采集失败, 保留上一版"

      # ── Newsnow 聚合热点 (15平台, 免key, 借鉴 TrendRadar) ──────
      - name: Collect hot news (Newsnow)
        run: |
          python3 scripts/collect_hotnews.py --out data/hot_news.json \
            || echo "::warning::hot_news 采集失败, 保留上一版"

      # ── 热点→股票影响映射 (news_impact) ──────────────────────
      - name: News impact mapping
        run: |
          python3 scripts/build_news_maps.py || echo "::warning::maps 构建失败"
          python3 scripts/news_impact.py --in data/hot_news.json \
            --news data/news_extra.json --out data/news_impact.json \
            || echo "::warning::news_impact 失败, 保留上一版"
          # 今日主线 + 热点主题: 从上面的映射结果聚合,
          # 供给 index.html 的「今日主线」「热点主题」两个 tab
          python3 scripts/build_mainlines.py --news data/news_impact.json \
            --hot data/hot_impact.json \
            || echo "::warning::build_mainlines 失败, 保留上一版"

      # ── 数据新鲜度审计 ────────────────────────────────────────
      # 2026-10-16 用户反馈「有的数据没有更新/过时」, 根因之一是无人监测新鲜度,
      # 全靠用户看到才知道。这里每轮采集后自查一次, 超阈值即在 Actions 日志
      # 告警 (不阻断流程, 采集失败已有各自的保留上一版逻辑)。
      - name: Freshness audit
        run: |
          python3 scripts/audit_freshness.py --out data/freshness_audit.json \
            --report data/freshness_audit.md \
            || echo "::warning::有文件超过新鲜度阈值, 见 data/freshness_audit.md"
          python3 scripts/build_analysis_manifest.py || echo "::warning::analysis_manifest 构建失败"

      # ── 全球各大股市实时 (15指数, 含休市状态与情绪) ───────────
      - name: Collect global markets
        run: |
          python3 scripts/collect_global_markets.py --out data/global_markets.json \
            || echo "::warning::global_markets 采集失败, 保留上一版"

      # ── 全球 K 线历史 (美股/港股增量构建, 腾讯+东财双源) ─────
      - name: Collect global kline
        run: |
          python3 scripts/collect_global_kline.py --markets us,hk --count 640 \
            --out data/global_kline.json \
            || echo "::warning::global_kline 采集失败, 保留上一版"

      # ── KlineShare 看板免 key 实时 (破甲逆向成果) ──────────────
      # hq.klineshare.cn/api/* 全免鉴权; realtime 给 OHLC+成交额,
      # plates 给全市场板块。realtime 每只间隔 1.2s (看板限流严)。
      - name: Collect KlineShare HQ
        run: |
          python3 scripts/collect_klineshare.py --collect --out data/klineshare_hq.json \
            || echo "::warning::klineshare 采集失败, 保留上一版"

      - name: Summary
        run: |
          python3 - <<'PY'
          import json, os
          for f in sorted(os.listdir("data")):
              if f.startswith("shard_") and f.endswith(".json"):
                  d = json.load(open("data/" + f, encoding="utf-8"))
                  s = d.get("summary") or {}
                  meta = d.get("shard_meta") or {}
                  print("%s <- %s shard=%s raw=%s merged=%s err=%s" % (
                      f, meta.get("repo"), meta.get("shard"),
                      s.get("total_raw"), s.get("total_merged"),
                      len(s.get("errors") or [])))
          ne = "data/news_extra.json"
          if os.path.exists(ne):
              d = json.load(open(ne, encoding="utf-8"))
              print("news_extra: %d 条 %s" % (d.get("n_items"), d.get("per_source")))
          PY

      - name: Summary
        run: |
          python3 - <<'PY'
          import json, os
          p = "data/news_extra.json"
          if not os.path.exists(p):
              print("no news_extra.json")
              raise SystemExit(0)
          d = json.load(open(p, encoding="utf-8"))
          print("ts:", d.get("ts"))
          print("per_source:", d.get("per_source"))
          for it in (d.get("items") or [])[:5]:
              print("  [%s] %s" % (it.get("source"), (it.get("title") or "")[:60]))
          PY

      # ── 提交 (只提交自己分片的文件, 不碰别人的) ──────────────
      # 注意: git_push_retry 的 --protect 是 append 型, 必须一个路径一个 --protect,
      # 写成 --protect a b 会被 argparse 当未知参数 (实测 exit 2)。
      - name: Commit and push
        run: |
          git config user.name "shard-collect-bot"
          git config user.email "3576982374@qq.com"
          PROTECT_ARGS=""
          for f in data/shard_${SHARD}.json data/news_extra.json data/global_markets.json data/klineshare_hq.json data/hot_news.json data/news_impact.json data/hot_themes.json data/mainline.json data/stock_names.json data/industry_stocks.json data/global_kline.json data/freshness_audit.json data/freshness_audit.md; do
            PROTECT_ARGS="$PROTECT_ARGS --protect $f"
          done
          if [ "$SHARD_EXTRA" != "$SHARD" ]; then
            PROTECT_ARGS="$PROTECT_ARGS --protect data/shard_${SHARD_EXTRA}.json"
          fi
          python3 scripts/git_push_retry.py \
            --msg "shard(${SHARD}): collect $(TZ=Asia/Shanghai date '+%m-%d %H:%M')" \
            data/shard_${SHARD}.json data/news_extra.json data/global_markets.json data/klineshare_hq.json data/hot_news.json data/news_impact.json data/stock_names.json data/industry_stocks.json data/global_kline.json \
            $PROTECT_ARGS
