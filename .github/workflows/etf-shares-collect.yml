# etf-shares-collect — 宽基 ETF 份额估算（聪明钱仓位信号）
#
# 方法：份额(亿份) = 成交量/换手率（公众号「多多拾贝」盯份额抄作业法，用户指定借鉴 2026-10-24）。
# 本地容器出口被东财按 IP 限流，Actions 北美出口可达；每日收盘后一轮，增量追加 data/etf_shares.json。
name: etf-shares-collect
on:
  schedule:
    # CST 16:30 工作日（收盘后）→ UTC 08:30
    - cron: '30 8 * * 1-5'
  workflow_dispatch: {}
permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect ETF share estimates
        run: python3 scripts/collect_etf_shares.py

      - name: Commit & push
        run: |
          git config user.name "etf-shares-bot"
          git config user.email "741059079@qq.com"
          git fetch origin main
          git reset --soft origin/main
          git add data/etf_shares.json
          if git diff --quiet --cached HEAD; then
            echo "no changes"
          else
            ts=$(TZ=Asia/Shanghai date '+%Y%m%d_%H%M')
            git commit -m "data: etf shares $ts"
            git -c http.version=HTTP/1.1 push origin main || {
              echo "push raced, retrying"
              git fetch origin main
              git reset --soft origin/main
              git add data/etf_shares.json
              git commit -m "data: etf shares $ts" 2>/dev/null || true
              git push origin main
            }
          fi
