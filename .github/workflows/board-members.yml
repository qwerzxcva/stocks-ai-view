name: board-members

# 板块成分股构建 (云端跑, 因为东财对本地容器 IP 限流)
# 修复 news_impact 的 ETF 污染: 旧 concept_map 每概念只有 1 只股票,
# 映射器退化到指数 ETF, 消息面选股失效。
on:
  workflow_dispatch:
    inputs:
      boards:
        description: '指定板块代码 (留空=全部)'
        default: ''
      max_boards:
        description: '最多处理板块数 (0=全部)'
        default: '0'
  schedule:
    # 每周日 20:00 CST 重建成分 (成分变动不频繁)
    - cron: '0 12 * * 0'

permissions:
  contents: write

concurrency:
  group: board-members
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build board members
        run: |
          set -euo pipefail
          BOARDS="${{ github.event.inputs.boards || '' }}"
          MAXB="${{ github.event.inputs.max_boards || '0' }}"
          ARGS=""
          if [ -n "$BOARDS" ]; then ARGS="$ARGS --boards $BOARDS"; fi
          if [ "$MAXB" != "0" ]; then ARGS="$ARGS --max-boards $MAXB"; fi
          python3 -u scripts/build_board_members.py $ARGS

      - name: Validate output
        run: |
          python3 - <<'PY'
          import json, sys
          try:
              d = json.load(open('data/board_members.json', encoding='utf-8'))
          except Exception as e:
              sys.exit(f'board_members.json 不可读: {e}')
          n_boards = d.get('n_boards', 0)
          n_pairs = d.get('n_pairs', 0)
          print(f'boards={n_boards} pairs={n_pairs} suspect={len(d.get("suspect_boards") or [])}')
          if n_boards < 10:
              sys.exit(f'板块数过少 ({n_boards}), 拒绝发布')
          if n_pairs < 1000:
              sys.exit(f'板块-个股对过少 ({n_pairs}), 拒绝发布')
          # ETF 污染检测: 任一板块里 ETF 占比 >50% 即告警
          ETF = ("159","510","511","512","513","515","516","518","560","588")
          bad = []
          for bk, b in (d.get('boards') or {}).items():
              st = b.get('stocks') or []
              if not st:
                  continue
              etf = sum(1 for s in st if str(s.get('code',''))[:3] in ETF)
              if etf / len(st) > 0.5:
                  bad.append(bk)
          if bad:
              sys.exit(f'ETF 污染板块: {bad[:5]}')
          print('validation OK')
          PY

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "board-members-bot"
          git config user.email "board-members-bot@users.noreply.github.com"
          git add -- data/board_members.json
          if git diff --cached --quiet; then
            echo "no board member changes"
            exit 0
          fi
          git commit -m "data: board members $(TZ=Asia/Shanghai date '+%Y%m%d_%H%M')"
          for i in 1 2 3; do
            git fetch origin main
            git reset --soft origin/main
            git add -- data/board_members.json
            git commit -m "data: board members $(TZ=Asia/Shanghai date '+%Y%m%d_%H%M')" 2>/dev/null || true
            if git push origin HEAD:main; then echo pushed; break; fi
            sleep 10
          done