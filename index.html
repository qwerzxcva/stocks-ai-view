## 近期热点新闻

<div id="news" style="margin-bottom:1.5rem"></div>

<style>
table th{background:#1f2328;color:#fff;padding:6px 8px;text-align:left}
table td{padding:6px 8px;border-bottom:1px solid #d0d7de}
table tr:hover{background:#f6f8fa}
.card{background:#fff;border:1px solid #d0d7de;border-radius:6px;padding:.75rem}
</style>
<script>
async function fetchLatest(){
  try{
    const r = await fetch('data/latest.json?t='+Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  }catch(e){console.error(e);return null;}
}
function fmt(n){return n==null?'—':n.toFixed(2);}
function trend(pct){const c=pct>=0?'#1a7f37':'#cf222e',s=pct>=0?'+':'';return `<span style=\"color:${c};font-weight:600\">${s}${pct}%</span>`;}
function scoreColor(s){return s>=0.6?'#1a7f37':s>=0.3?'#0969da':'#6e7781';}
async function render(){
  const d = await fetchLatest();
  const status = document.getElementById('live-status');
  if(!d){status.innerHTML='⚠️ 数据加载失败，请稍后刷新';return;}
  const ts = new Date(d.ts).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});
  status.innerHTML=`✅ <b>${ts}</b> · 涨停 ${d.market.limit_up} / 跌停 ${d.market.limit_down} / 炸板 ${d.market.broken} · 封板率 ${d.market.zt_rate}% · 来源: ${d.meta.source}`;

  const m = document.getElementById('market');
  m.innerHTML = d.market.indices.map(i=>`<div class="card"><b>${i.name}</b><br/><span style="font-size:1.3em">${fmt(i.price)}</span> ${trend(i.chg_pct)}</div>`).join('');

  const th = document.getElementById('themes');
  th.innerHTML = d.themes.map(t=>`<div class="card" style="margin-bottom:.5rem"><b>${t.name}</b> <span style="color:#6e7781">(${t.news_count}条)</span><br/><small>${t.sample.join(' | ')}</small></div>`).join('');

  const ztb = document.getElementById('zt-body');
  ztb.innerHTML = d.limit_up_pool.slice(0,30).map(z=>`<tr><td>${z.code}</td><td>${z.name}</td><td>${fmt(z.price)}</td><td>${trend(z.chg_pct)}</td><td>${z.lianban||'首板'}</td><td>${z.zt_time||'—'}</td></tr>`).join('');

  const pb = document.getElementById('pick-body');
  pb.innerHTML = d.picks.slice(0,30).map(p=>`<tr><td>${p.code}</td><td>${p.name}</td><td>${fmt(p.price)}</td><td>${trend(p.chg_pct)}</td><td>${p.lianban||'首板'}</td><td>${p.theme_hit?'🔥 热点关联':'—'}</td><td style="font-weight:700;color:${scoreColor(p.zt_score)}">${p.zt_score.toFixed(3)}</td></tr>`).join('');

  const nw = document.getElementById('news');
  nw.innerHTML = d.news_recent.slice(0,20).map(n=>`<div style="padding:4px 0;border-bottom:1px solid #d0d7de;font-size:.9rem"><b>${n.title}</b> <span style="color:#6e7781;margin-left:.5rem">[${n.src}]</span> ${n.theme.length?'<span style=\"color:#0969da\">'+n.theme.join(',')+'</span>':''}</div>`).join('');
}
render();
setInterval(render, 60000);
</script>
